name: Generate Docs

on:
  push:
    paths:
      - "workflow/**"
      - "docs/**"

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - run: python docs/generate_docs.py

      - uses: actions/upload-artifact@v4
        with:
          name: workflow-docs
          path: docs/workflows.json
