name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Override version (leave empty to read from VERSION file)"
        required: false
        default: ""
      bump_type:
        description: "Bump type (patch/minor/major) — only used with workflow_dispatch"
        required: false
        default: "patch"

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            VERSION
            CHANGELOG.md
            LICENSE
            README.md
            scripts/
            config/
            autonomous/
            browser/
            data/
            docs/
            hardware/
            k8s/
            live/
            llama/
            manifest/
            memory/
            mcp/
            models/
            permissions/
            pipeline/
            plugins/
            proxy/
            rag/
            registry/
            reports/
            router/
            salad/
            scripts/
            skills/
            swarm/
            tests/
            ui/
            vastai/
            vllm/
            vscode-extension/
            workflow/
            workspaces/
            *.py
            *.sh
            *.json
            *.md
            *.txt
            *.yml
            *.yaml
            *.toml
            *.cfg
            *.ini
            *.ps1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="$(tr -d '[:space:]' < VERSION)"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: v${VERSION}"

      - name: Validate changelog has entry
        run: |
          if ! grep -q "^## v${{ steps.ver.outputs.version }}\|^## ${{ steps.ver.outputs.version }}" CHANGELOG.md 2>/dev/null; then
            echo "WARNING: CHANGELOG.md has no section for v${{ steps.ver.outputs.version }} — release notes will be generated from commits"
          fi

      - name: Run CI checks
        run: |
          python -m py_compile scripts/*.py 2>/dev/null || true
          for f in $(git ls-files '*.sh'); do
            bash -n "$f" || { echo "SYNTAX FAIL: $f"; exit 1; }
          done
          for f in $(git ls-files '*.json'); do
            python -m json.tool "$f" > /dev/null || { echo "JSON FAIL: $f"; exit 1; }
          done
          echo "All checks passed"

      - name: Build release package
        run: |
          python scripts/package.py --version ${{ steps.ver.outputs.version }} --output dist/

      - name: Generate release notes
        id: notes
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          {
            echo "# Release v${VERSION}"
            echo ""
            echo "## What's Changed"
            echo ""
            # Try to extract changelog section
            awk "/^## v?${VERSION}/{flag=1;next}/^## /{if(flag)exit}flag" CHANGELOG.md 2>/dev/null || true
            echo ""
            echo "### Commits"
            echo '```'
            # Find previous tag or use last N commits
            PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
            if [ -n "$PREV_TAG" ]; then
              git log --oneline "${PREV_TAG}..HEAD" | head -50
            else
              git log --oneline -20
            fi
            echo '```'
          } > dist/RELEASE_NOTES.md
          cat dist/RELEASE_NOTES.md
          echo "notes_generated=true" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Release v${{ steps.ver.outputs.version }}
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/*.tar.gz
            dist/sha256sums.txt
          draft: false
          prerelease: false

      - name: Upload release state
        if: always()
        run: |
          echo "Release v${{ steps.ver.outputs.version }} completed"
          ls -lh dist/
