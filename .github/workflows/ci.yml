name: ci
# re-scan-trigger: CodeQL cleanup round 3

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python compile check
        run: |
          files=$(git ls-files '*.py')
          [ -z "$files" ] || python -m py_compile $files

      - name: Bash syntax check
        run: |
          status=0
          for f in $(git ls-files '*.sh'); do
            bash -n "$f" || { echo "SYNTAX FAIL: $f"; status=1; }
          done
          exit $status

      - name: JSON validity check
        run: |
          status=0
          for f in $(git ls-files '*.json'); do
            python -m json.tool "$f" > /dev/null || { echo "JSON FAIL: $f"; status=1; }
          done
          exit $status

      - name: JS syntax check
        run: |
          status=0
          for f in $(git ls-files '*.js'); do
            node --check "$f" || { echo "JS FAIL: $f"; status=1; }
          done
          exit $status

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Verify test count
        run: |
          COUNT=$(python -m pytest tests/ --co -q 2>&1 | grep -E '^\S+\.py:' | awk -F': ' '{s+=$2} END{print s}')
          echo "Collected $COUNT tests"
          if [ "$COUNT" -lt 1154 ]; then
            echo "FAIL: Expected at least 1154 tests, found $COUNT"
            exit 1
          fi

      - name: Debug test collection
        run: |
          python -m pytest tests/ --co -v --tb=short 2>&1 | tee /tmp/pytest_collect.log
          echo "---"
          echo "Total collected:"
          python -m pytest tests/ --co -q 2>&1 | grep -E '^\S+\.py:' | awk -F': ' '{s+=$2} END{print s}'
          echo "---"
          echo "Files with errors:"
          grep -i "error collecting" /tmp/pytest_collect.log || echo "None"

      - name: Verify asyncio mode
        run: |
          if ! grep -q 'asyncio_mode' pyproject.toml; then
            echo "FAIL: asyncio_mode not set in pyproject.toml"
            exit 1
          fi
          echo "asyncio_mode configured OK"

      - name: Pytest — unit + regression + integration
        run: |
          python -m pytest tests/ \
            tests/regression/prompts.py \
            tests/integration/test_api.py \
            -q --tb=short

      - name: Pytest — load tests (locust smoke + GPU)
        run: |
          python -m pytest tests/load/test_gpu.py tests/load/test_router.py \
            -q --tb=short
        env:
          MOCK_LLM: "1"
