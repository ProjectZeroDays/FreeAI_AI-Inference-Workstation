<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FreeAI — Scheduler</title>
  <link rel="stylesheet" href="/static/dashboard.css" />
  <style>
    .sched-layout { display:grid; grid-template-columns:260px 1fr; min-height:100vh; }
    .sched-main { padding:22px 24px 32px; min-width:0; }
    .sched-topbar { display:flex; align-items:center; justify-content:space-between;
                    padding:6px 2px 16px; border-bottom:1px solid var(--border);
                    margin-bottom:18px; flex-wrap:wrap; gap:10px; }
    .sched-topbar h1 { margin:0; font-size:22px; letter-spacing:-.02em; }
    .sched-topbar p { margin:4px 0 0; color:var(--muted); font-size:13px; }
    .sched-stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:12px; margin-bottom:18px; }
    .s-stat { background:rgba(255,255,255,.04); border:1px solid var(--border); border-radius:12px; padding:12px 14px; }
    .s-stat .s-val { font-size:22px; font-weight:700; color:var(--accent); }
    .s-stat .s-lbl { font-size:11px; color:var(--muted-2); margin-top:2px; }
    .job-list { display:flex; flex-direction:column; gap:10px; }
    .job-card { background:linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.02));
                border:1px solid var(--border); border-radius:14px; padding:14px 16px;
                transition:border-color .18s ease; }
    .job-card:hover { border-color:var(--border-strong); }
    .job-head { display:flex; align-items:center; gap:12px; margin-bottom:8px; }
    .job-name { font-size:14px; font-weight:600; color:var(--text); flex:1; }
    .job-cron { font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--accent-2); }
    .job-status { display:inline-flex; align-items:center; gap:5px; padding:3px 10px;
                  border-radius:999px; font-size:11px; font-weight:600; }
    .job-status.enabled { background:rgba(34,197,94,.12); color:var(--accent); border:1px solid rgba(34,197,94,.3); }
    .job-status.disabled { background:rgba(148,163,184,.08); color:var(--muted-2); border:1px solid var(--border); }
    .job-status.running { background:rgba(56,189,248,.12); color:var(--accent-2); border:1px solid rgba(56,189,248,.3); animation:pulse 1.5s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
    .job-meta { display:flex; gap:16px; flex-wrap:wrap; font-size:12px; color:var(--muted); }
    .job-meta span { display:flex; align-items:center; gap:4px; }
    .job-actions { display:flex; gap:6px; margin-top:10px; }
    .job-actions button { padding:5px 10px; border-radius:8px; border:1px solid var(--border);
                         background:var(--panel-2); color:var(--muted); cursor:pointer;
                         font-size:12px; transition:all .15s; }
    .job-actions button:hover { border-color:var(--accent-2); color:var(--text); }
    .job-actions button.danger:hover { border-color:var(--danger); color:var(--danger); }
    .modal-overlay { display:none; position:fixed; inset:0; background:rgba(2,6,23,.7);
                     backdrop-filter:blur(4px); z-index:100; place-items:center; }
    .modal-overlay.open { display:grid; }
    .modal { background:var(--panel); border:1px solid var(--border); border-radius:16px;
             padding:24px; width:min(480px,90vw); box-shadow:var(--shadow); }
    .modal h2 { margin:0 0 16px; font-size:16px; }
    .modal-field { display:flex; flex-direction:column; gap:6px; margin-bottom:12px; }
    .modal-field label { font-size:12px; color:var(--muted); font-weight:500; }
    .modal-field input, .modal-field textarea, .modal-field select {
      background:rgba(2,6,23,.55); color:var(--text);
      border:1px solid var(--border); border-radius:10px; padding:8px 12px;
      font-size:13px; font-family:Inter,system-ui,sans-serif; }
    .modal-field textarea { min-height:80px; resize:vertical; font-family:'JetBrains Mono',monospace; }
    .modal-field input:focus, .modal-field textarea:focus, .modal-field select:focus {
      outline:none; border-color:rgba(56,189,248,.45); box-shadow:0 0 0 3px rgba(56,189,248,.12); }
    .modal-actions { display:flex; gap:8px; justify-content:flex-end; margin-top:16px; }
    .empty-state { text-align:center; padding:60px 20px; color:var(--muted); }
    .search-box { background:rgba(2,6,23,.55); color:var(--text); border:1px solid var(--border);
                  border-radius:10px; padding:7px 12px; font-size:13px; width:220px;
                  font-family:Inter,system-ui,sans-serif; }
    .search-box:focus { outline:none; border-color:rgba(56,189,248,.45);
                        box-shadow:0 0 0 3px rgba(56,189,248,.12); }
    .toast { position:fixed; bottom:24px; right:24px; background:var(--panel);
             border:1px solid var(--border); border-radius:12px; padding:12px 18px;
             font-size:13px; color:var(--text); box-shadow:var(--shadow);
             transform:translateY(80px); opacity:0; transition:all .25s ease; z-index:999; }
    .toast.show { transform:translateY(0); opacity:1; }
    .toast.success { border-color:rgba(34,197,94,.4); }
    .toast.error { border-color:rgba(239,68,68,.4); }
  </style>
</head>
<body>
  <div class="sched-layout">
    <nav class="sidebar" aria-label="Primary">
      <div class="brand">
        <div class="brand-mark">◈</div>
        <div class="brand-text"><strong>FreeAI</strong><span>Scheduler</span></div>
      </div>
      <div class="nav-section">
        <span class="nav-label">Navigation</span>
        <a href="/" class="nav-item"><span class="nav-dot"></span> Dashboard</a>
        <a href="/skills" class="nav-item"><span class="nav-dot"></span> Skills</a>
        <a href="/providers" class="nav-item"><span class="nav-dot"></span> Providers</a>
        <a href="/hermes" class="nav-item"><span class="nav-dot"></span> Hermes</a>
        <a href="/workflows" class="nav-item"><span class="nav-dot"></span> Workflows</a>
        <a href="/scheduler" class="nav-item active"><span class="nav-dot"></span> Scheduler</a>
        <a href="/mcp" class="nav-item"><span class="nav-dot"></span> MCP Registry</a>
        <a href="/subagents" class="nav-item"><span class="nav-dot"></span> Subagents</a>
      </div>
      <div class="nav-section">
        <span class="nav-label">Tools</span>
        <a href="/settings" class="nav-item"><span class="nav-dot"></span> Settings</a>
        <a href="/logs" class="nav-item"><span class="nav-dot"></span> Logs</a>
      </div>
      <div class="sidebar-foot">
        <span class="live-dot" aria-hidden="true"></span>
        <span class="muted">Live</span>
        <span id="job-count" class="muted" style="margin-left:auto">0 jobs</span>
      </div>
    </nav>

    <div class="sched-main">
      <header class="sched-topbar">
        <div>
          <h1>Scheduler</h1>
          <p>Cron-based job orchestration for autonomous tasks</p>
        </div>
        <div style="display:flex;gap:10px;align-items:center">
          <input type="text" class="search-box" id="search" placeholder="Search jobs…" />
          <button class="btn" id="btn-refresh">↻ Refresh</button>
          <button class="btn btn-primary" id="btn-new">+ New Job</button>
        </div>
      </header>

      <div class="sched-stats" id="stats">
        <div class="s-stat"><span class="s-val" id="s-total">—</span><span class="s-lbl">Total Jobs</span></div>
        <div class="s-stat"><span class="s-val" id="s-enabled">—</span><span class="s-lbl">Enabled</span></div>
        <div class="s-stat"><span class="s-val" id="s-running">—</span><span class="s-lbl">Running</span></div>
        <div class="s-stat"><span class="s-val" id="s-config">—</span><span class="s-lbl">Scheduler</span></div>
      </div>

      <div class="job-list" id="job-list">
        <div class="empty-state">
          <div style="font-size:40px;opacity:.4;margin-bottom:12px">◷</div>
          <p>Loading scheduler jobs…</p>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <h2 id="modal-title">New Job</h2>
      <div class="modal-field">
        <label>Job Name</label>
        <input type="text" id="job-name" placeholder="my-scheduled-task" />
      </div>
      <div class="modal-field">
        <label>Cron Expression</label>
        <input type="text" id="job-cron" placeholder="0 2 * * *" value="0 0 * * *" />
      </div>
      <div class="modal-field">
        <label>Handler (module.function)</label>
        <input type="text" id="job-handler" placeholder="workflow.engine.run" />
      </div>
      <div class="modal-actions">
        <button class="btn" id="btn-cancel">Cancel</button>
        <button class="btn btn-primary" id="btn-save-job">Save Job</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const $ = id => document.getElementById(id);
    function toast(msg, type='success') {
      const t = $('toast');
      t.textContent = msg; t.className = 'toast show ' + type;
      setTimeout(() => t.classList.remove('show'), 3000);
    }
    function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

    let jobs = [];

    async function load() {
      try {
        const r = await fetch('/api/scheduler');
        if (!r.ok) throw new Error(r.statusText);
        const d = await r.json();
        jobs = d.jobs || [];
        const cfg = d.config || {};
        $('s-total').textContent = jobs.length;
        $('s-enabled').textContent = jobs.filter(j => j.enabled).length;
        $('s-running').textContent = d.running || 0;
        $('s-config').textContent = cfg.enabled ? 'Active' : 'Disabled';
        $('job-count').textContent = jobs.length + ' jobs';
        render(jobs);
      } catch(e) {
        $('job-list').innerHTML = `<div class="empty-state"><p>Error loading scheduler: ${esc(e.message)}</p></div>`;
      }
    }

    function render(items, filter='') {
      const list = $('job-list');
      const filtered = filter
        ? items.filter(j => j.name.toLowerCase().includes(filter) || (j.handler||'').toLowerCase().includes(filter))
        : items;
      if (!filtered.length) {
        list.innerHTML = `<div class="empty-state"><div style="font-size:40px;opacity:.4;margin-bottom:12px">◷</div>
          <p>${filter ? 'No jobs match your search.' : 'No scheduled jobs. Click "+ New Job" to create one.'}</p></div>`;
        return;
      }
      list.innerHTML = filtered.map(j => `
        <div class="job-card" data-id="${esc(j.id)}">
          <div class="job-head">
            <span class="job-name">${esc(j.name || 'untitled')}</span>
            <span class="job-cron">${esc(j.cron || '—')}</span>
            <span class="job-status ${j.enabled ? 'enabled' : 'disabled'}">
              <span style="width:6px;height:6px;border-radius:50%;background:currentColor"></span>
              ${j.enabled ? 'Enabled' : 'Disabled'}
            </span>
          </div>
          <div class="job-meta">
            <span>Handler: <strong style="color:var(--text)">${esc(j.handler || '—')}</strong></span>
            <span>Status: <strong style="color:var(--text)">${esc(j.status || 'queued')}</strong></span>
            <span>Created: <strong style="color:var(--text)">${new Date((j.created_at||0)*1000).toLocaleDateString()}</strong></span>
          </div>
          <div class="job-actions">
            <button onclick="toggleJob('${esc(j.id)}')">${j.enabled ? 'Disable' : 'Enable'}</button>
            <button class="danger" onclick="deleteJob('${esc(j.id)}')">Delete</button>
          </div>
        </div>
      `).join('');
    }

    async function toggleJob(id) {
      try {
        const r = await fetch(`/api/scheduler/jobs/${encodeURIComponent(id)}/toggle`, {method:'POST'});
        const d = await r.json();
        if (d.ok) {
          const j = jobs.find(j => j.id === id);
          if (j) j.enabled = d.enabled;
          render(jobs, $('search').value);
          toast(d.enabled ? 'Job enabled' : 'Job disabled');
        } else toast(d.error || 'Failed', 'error');
      } catch(e) { toast('Network error: ' + e.message, 'error'); }
    }

    async function deleteJob(id) {
      if (!confirm('Delete this job?')) return;
      try {
        const r = await fetch(`/api/scheduler/jobs/${encodeURIComponent(id)}`, {method:'DELETE'});
        const d = await r.json();
        if (d.deleted) {
          jobs = jobs.filter(j => j.id !== id);
          render(jobs, $('search').value);
          load();
          toast('Job deleted');
        } else toast(d.error || 'Delete failed', 'error');
      } catch(e) { toast('Network error: ' + e.message, 'error'); }
    }

    $('btn-new').addEventListener('click', () => {
      $('modal-title').textContent = 'New Job';
      $('job-name').value = '';
      $('job-cron').value = '0 0 * * *';
      $('job-handler').value = '';
      $('modal-overlay').classList.add('open');
    });
    $('btn-cancel').addEventListener('click', () => $('modal-overlay').classList.remove('open'));
    $('modal-overlay').addEventListener('click', e => { if (e.target === $('modal-overlay')) $('modal-overlay').classList.remove('open'); });

    $('btn-save-job').addEventListener('click', async () => {
      const name = $('job-name').value.trim();
      const cron = $('job-cron').value.trim();
      const handler = $('job-handler').value.trim();
      if (!name) { toast('Job name is required', 'error'); return; }
      try {
        const r = await fetch('/api/scheduler/jobs', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({name, cron, handler}),
        });
        const d = await r.json();
        if (d.ok) {
          jobs.push(d.job);
          render(jobs, $('search').value);
          load();
          $('modal-overlay').classList.remove('open');
          toast('Job created');
        } else toast(d.error || 'Failed', 'error');
      } catch(e) { toast('Network error: ' + e.message, 'error'); }
    });

    $('search').addEventListener('input', e => render(jobs, e.target.value));
    $('btn-refresh').addEventListener('click', load);

    load();
    setInterval(load, 30000);
  </script>
</body>
</html>
