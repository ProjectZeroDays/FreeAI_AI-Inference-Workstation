<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FreeAI — Workflows</title>
  <link rel="stylesheet" href="/static/dashboard.css" />
  <style>
    .wf-layout { display:grid; grid-template-columns:260px 1fr; min-height:100vh; }
    .wf-main { padding:22px 24px 32px; min-width:0; }
    .wf-topbar { display:flex; align-items:center; justify-content:space-between;
                 padding:6px 2px 16px; border-bottom:1px solid var(--border);
                 margin-bottom:18px; flex-wrap:wrap; gap:10px; }
    .wf-topbar h1 { margin:0; font-size:22px; letter-spacing:-.02em; }
    .wf-topbar p { margin:4px 0 0; color:var(--muted); font-size:13px; }
    .wf-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(300px,1fr)); gap:14px; }
    .wf-card {
      background:linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.02));
      border:1px solid var(--border); border-radius:14px; padding:16px;
      transition:border-color .18s ease, transform .18s ease;
    }
    .wf-card:hover { border-color:var(--border-strong); transform:translateY(-2px); }
    .wf-card-head { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
    .wf-icon { width:36px; height:36px; border-radius:10px; display:grid; place-items:center;
               background:linear-gradient(135deg, rgba(14,165,233,.2), rgba(34,197,94,.2));
               color:var(--accent-2); font-size:16px; flex-shrink:0; }
    .wf-title { font-size:15px; font-weight:600; color:var(--text); }
    .wf-id { font-size:11px; color:var(--muted-2); font-family:'JetBrains Mono',monospace; }
    .wf-steps { display:flex; flex-direction:column; gap:6px; margin:10px 0; }
    .wf-step { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--muted); }
    .wf-step-num { width:20px; height:20px; border-radius:50%; display:grid; place-items:center;
                    background:rgba(56,189,248,.15); color:var(--accent-2);
                    font-size:10px; font-weight:700; flex-shrink:0; }
    .wf-meta { display:flex; gap:10px; flex-wrap:wrap; margin-top:10px; }
    .wf-badge { display:inline-flex; align-items:center; gap:5px; padding:3px 10px;
                border-radius:999px; font-size:11px; font-weight:600; }
    .wf-badge.active { background:rgba(34,197,94,.12); color:var(--accent); border:1px solid rgba(34,197,94,.3); }
    .wf-badge.inactive { background:rgba(148,163,184,.08); color:var(--muted-2); border:1px solid var(--border); }
    .wf-badge.error { background:rgba(239,68,68,.12); color:var(--danger); border:1px solid rgba(239,68,68,.3); }
    .wf-registries { margin-top:20px; }
    .wf-registries h3 { font-size:14px; font-weight:600; margin-bottom:12px; }
    .reg-list { display:flex; flex-direction:column; gap:8px; }
    .reg-item { display:flex; align-items:center; gap:12px; padding:10px 14px;
                background:rgba(255,255,255,.03); border:1px solid var(--border);
                border-radius:10px; font-size:13px; }
    .reg-name { font-weight:500; color:var(--text); }
    .reg-entries { font-size:12px; color:var(--muted); margin-left:auto; }
    .empty-state { text-align:center; padding:60px 20px; color:var(--muted); grid-column:1/-1; }
    .search-box { background:rgba(2,6,23,.55); color:var(--text); border:1px solid var(--border);
                  border-radius:10px; padding:7px 12px; font-size:13px; width:240px;
                  font-family:Inter,system-ui,sans-serif; }
    .search-box:focus { outline:none; border-color:rgba(56,189,248,.45);
                        box-shadow:0 0 0 3px rgba(56,189,248,.12); }
    .toast { position:fixed; bottom:24px; right:24px; background:var(--panel);
             border:1px solid var(--border); border-radius:12px; padding:12px 18px;
             font-size:13px; color:var(--text); box-shadow:var(--shadow);
             transform:translateY(80px); opacity:0; transition:all .25s ease; z-index:999; }
    .toast.show { transform:translateY(0); opacity:1; }
    .toast.success { border-color:rgba(34,197,94,.4); }
    .toast.error { border-color:rgba(239,68,68,.4); }
  </style>
</head>
<body>
  <div class="wf-layout">
    <nav class="sidebar" aria-label="Primary">
      <div class="brand">
        <div class="brand-mark">◈</div>
        <div class="brand-text"><strong>FreeAI</strong><span>Workflows</span></div>
      </div>
      <div class="nav-section">
        <span class="nav-label">Navigation</span>
        <a href="/" class="nav-item"><span class="nav-dot"></span> Dashboard</a>
        <a href="/skills" class="nav-item"><span class="nav-dot"></span> Skills</a>
        <a href="/providers" class="nav-item"><span class="nav-dot"></span> Providers</a>
        <a href="/hermes" class="nav-item"><span class="nav-dot"></span> Hermes</a>
        <a href="/workflows" class="nav-item active"><span class="nav-dot"></span> Workflows</a>
        <a href="/scheduler" class="nav-item"><span class="nav-dot"></span> Scheduler</a>
        <a href="/mcp" class="nav-item"><span class="nav-dot"></span> MCP Registry</a>
        <a href="/subagents" class="nav-item"><span class="nav-dot"></span> Subagents</a>
      </div>
      <div class="nav-section">
        <span class="nav-label">Tools</span>
        <a href="/settings" class="nav-item"><span class="nav-dot"></span> Settings</a>
        <a href="/logs" class="nav-item"><span class="nav-dot"></span> Logs</a>
      </div>
      <div class="sidebar-foot">
        <span class="live-dot" aria-hidden="true"></span>
        <span class="muted">Live</span>
        <span id="wf-count" class="muted" style="margin-left:auto">0 workflows</span>
      </div>
    </nav>

    <div class="wf-main">
      <header class="wf-topbar">
        <div>
          <h1>Workflow Engine</h1>
          <p>Manage workflow definitions and registry entries</p>
        </div>
        <div style="display:flex;gap:10px;align-items:center">
          <input type="text" class="search-box" id="search" placeholder="Search workflows…" />
          <button class="btn" id="btn-refresh">↻ Refresh</button>
        </div>
      </header>

      <div class="wf-grid" id="wf-grid">
        <div class="empty-state">
          <div style="font-size:40px;opacity:.4;margin-bottom:12px">◈</div>
          <p>Loading workflows…</p>
        </div>
      </div>

      <div class="wf-registries" id="reg-section" style="display:none">
        <h3>Registry Files</h3>
        <div class="reg-list" id="reg-list"></div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const $ = id => document.getElementById(id);
    function toast(msg, type='success') {
      const t = $('toast');
      t.textContent = msg;
      t.className = 'toast show ' + type;
      setTimeout(() => t.classList.remove('show'), 3000);
    }

    let workflows = [];

    async function load() {
      try {
        const [wfRes, regRes] = await Promise.all([
          fetch('/api/workflow'),
          fetch('/api/workflow/registries'),
        ]);
        const wfData = await wfRes.json();
        const regData = await regRes.json();
        workflows = wfData.workflows || [];
        $('wf-count').textContent = workflows.length + ' workflows';
        render(workflows);
        renderRegistries(regData.registries || []);
      } catch(e) {
        $('wf-grid').innerHTML = `<div class="empty-state" style="grid-column:1/-1">
          <div style="font-size:40px;opacity:.4;margin-bottom:12px">⚠</div>
          <p>Failed to load workflows: ${e.message}</p>
        </div>`;
      }
    }

    function render(items, filter='') {
      const grid = $('wf-grid');
      const filtered = filter
        ? items.filter(w => w.name.toLowerCase().includes(filter) || w.id.toLowerCase().includes(filter))
        : items;
      if (!filtered.length) {
        grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1">
          <div style="font-size:40px;opacity:.4;margin-bottom:12px">✦</div>
          <p>${filter ? 'No workflows match your search.' : 'No workflows found. Add a workflow JSON to workflow/workflows/.'}</p>
        </div>`;
        return;
      }
      grid.innerHTML = filtered.map(w => `
        <div class="wf-card">
          <div class="wf-card-head">
            <div class="wf-icon">⬡</div>
            <div>
              <div class="wf-title">${esc(w.name || w.id)}</div>
              <div class="wf-id">${esc(w.id)}</div>
            </div>
            <div style="margin-left:auto">
              <span class="wf-badge ${w.status || 'active'}">${w.status || 'active'}</span>
            </div>
          </div>
          <div class="wf-steps">
            <div class="wf-step"><span class="wf-step-num">→</span><span>${w.steps || 0} steps defined</span></div>
          </div>
          <div class="wf-meta">
            <span style="font-size:12px;color:var(--muted-2)">Steps: <strong style="color:var(--text)">${w.steps || 0}</strong></span>
          </div>
        </div>
      `).join('');
    }

    function renderRegistries(regs) {
      const sec = $('reg-section');
      const list = $('reg-list');
      if (!regs.length) { sec.style.display = 'none'; return; }
      sec.style.display = '';
      list.innerHTML = regs.map(r => `
        <div class="reg-item">
          <span class="reg-name">${esc(r.file)}</span>
          <span class="reg-entries">${r.entries || 0} entries</span>
        </div>
      `).join('');
    }

    function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

    $('search').addEventListener('input', e => render(workflows, e.target.value));
    $('btn-refresh').addEventListener('click', load);

    load();
    setInterval(load, 30000);
  </script>
</body>
</html>
