<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FreeAI — Files</title>
  <link rel="stylesheet" href="/static/dashboard.css" />
  <style>
    .files-layout{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
    .files-main{padding:22px 24px 32px;min-width:0}
    .files-topbar{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 16px;border-bottom:1px solid var(--border);margin-bottom:18px;flex-wrap:wrap;gap:10px}
    .files-topbar h1{margin:0;font-size:22px}
    .files-topbar p{margin:4px 0 0;color:var(--muted);font-size:13px}
    .breadcrumb{display:flex;align-items:center;gap:4px;margin-bottom:16px;flex-wrap:wrap;font-size:13px}
    .breadcrumb a{color:var(--accent-2);text-decoration:none;padding:3px 8px;border-radius:8px;border:1px solid transparent;transition:all .15s}
    .breadcrumb a:hover{background:rgba(56,189,248,.1);border-color:rgba(56,189,248,.25)}
    .breadcrumb .sep{color:var(--muted-2);font-size:11px}
    .breadcrumb .cur{color:var(--text);font-weight:600}
    .files-toolbar{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
    .files-toolbar input[type=text]{flex:1;min-width:180px}
    .files-toolbar .search-box{position:relative}
    .files-toolbar .search-box input{padding-left:32px}
    .files-toolbar .search-box::before{content:"⌕";position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted-2);font-size:14px;pointer-events:none}
    .view-toggle{display:flex;border:1px solid var(--border);border-radius:10px;overflow:hidden}
    .view-toggle button{border:none;border-radius:0;border-right:1px solid var(--border);padding:7px 10px;font-size:13px}
    .view-toggle button:last-child{border-right:none}
    .view-toggle button.active{background:rgba(34,197,94,.15);color:#BBF7D0}
    .files-header{display:grid;grid-template-columns:1fr 100px 140px 100px;padding:8px 14px;color:var(--muted-2);font-size:11px;text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--border);margin-bottom:4px}
    .files-header.grid-header{display:none}
    .file-row{display:grid;grid-template-columns:1fr 100px 140px 100px;align-items:center;padding:9px 14px;border-radius:10px;border:1px solid transparent;margin-bottom:3px;cursor:pointer;transition:all .15s;gap:8px}
    .file-row:hover{background:rgba(255,255,255,.03);border-color:var(--border)}
    .file-row.selected{background:rgba(34,197,94,.08);border-color:rgba(34,197,94,.25)}
    .file-row .fname{display:flex;align-items:center;gap:10px;min-width:0}
    .file-row .ficon{font-size:18px;width:22px;text-align:center;flex-shrink:0}
    .file-row .fnm{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .file-row .fsize,.file-row .fdate,.file-row .factions{text-align:right;font-size:12px}
    .file-row .factions{display:flex;justify-content:flex-end;gap:4px;opacity:0;transition:opacity .15s}
    .file-row:hover .factions{opacity:1}
    .file-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;margin-bottom:16px}
    .file-grid .file-card{display:flex;flex-direction:column;align-items:center;padding:14px 10px;border-radius:12px;border:1px solid var(--border);cursor:pointer;transition:all .15s;text-align:center;gap:8px}
    .file-grid .file-card:hover{background:rgba(255,255,255,.03);border-color:var(--border-strong);transform:translateY(-1px)}
    .file-grid .file-card.selected{background:rgba(34,197,94,.08);border-color:rgba(34,197,94,.25)}
    .file-grid .gicon{font-size:32px;line-height:1}
    .file-grid .gnm{font-size:12px;word-break:break-all;line-height:1.3;max-height:36px;overflow:hidden}
    .file-grid .gmeta{font-size:11px;color:var(--muted-2)}
    .empty-state{text-align:center;padding:60px 20px;color:var(--muted)}
    .empty-state .eicon{font-size:40px;margin-bottom:12px;opacity:.5}
    .preview-panel{margin-top:16px;border:1px solid var(--border);border-radius:14px;overflow:hidden;background:rgba(15,23,42,.6)}
    .preview-head{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--border);background:rgba(255,255,255,.02)}
    .preview-head .pname{font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px}
    .preview-body{padding:14px;max-height:420px;overflow:auto;font-size:13px}
    .preview-body pre{margin:0;white-space:pre-wrap;word-break:break-all;font-family:Fira Code,monospace;font-size:12px;line-height:1.6;color:var(--text)}
    .preview-body img{max-width:100%;max-height:400px;border-radius:8px;border:1px solid var(--border)}
    .preview-body .binary-hint{color:var(--muted);padding:20px;text-align:center}
    .dropzone{border:2px dashed var(--border);border-radius:14px;padding:32px;text-align:center;color:var(--muted);margin-bottom:16px;transition:all .2s;cursor:pointer}
    .dropzone.over{border-color:var(--accent);background:rgba(34,197,94,.06);color:var(--accent)}
    .dropzone .dzicon{font-size:28px;margin-bottom:8px}
    .modal-overlay{position:fixed;inset:0;background:rgba(2,6,23,.8);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:center;justify-content:center}
    .modal{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:22px;width:90%;max-width:440px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
    .modal h3{margin:0 0 14px;font-size:16px}
    .modal .row{margin-bottom:12px}
    .modal label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
    .modal input[type=text],.modal input[type=file]{width:100%;padding:8px 10px}
    .modal .btn-row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
    .toast{position:fixed;bottom:24px;right:24px;padding:10px 16px;border-radius:12px;font-size:13px;z-index:200;animation:toast-in .25s ease}
    .toast.ok{background:rgba(34,197,94,.18);border:1px solid rgba(34,197,94,.35);color:#BBF7D0}
    .toast.err{background:rgba(239,68,68,.18);border:1px solid rgba(239,68,68,.35);color:#FCA5A5}
    @keyframes toast-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    @media(max-width:768px){.files-layout{grid-template-columns:1fr}.files-header,.file-row{display:block;padding:8px 0}.file-row .fsize,.file-row .fdate,.file-row .factions{text-align:left}.file-grid{grid-template-columns:repeat(auto-fill,minmax(100px,1fr))}}
  </style>
</head>
<body>
  <div class="files-layout">
    <nav class="sidebar" aria-label="Primary">
      <div class="brand"><div class="brand-mark">◈</div><div class="brand-text"><strong>FreeAI</strong><span>Files</span></div></div>
      <div class="nav-section">
        <span class="nav-label">Navigation</span>
        <a href="/" class="nav-item"><span class="nav-dot"></span> Dashboard</a>
        <a href="/skills" class="nav-item"><span class="nav-dot"></span> Skills</a>
        <a href="/providers" class="nav-item"><span class="nav-dot"></span> Providers</a>
        <a href="/hermes" class="nav-item"><span class="nav-dot"></span> Hermes</a>
        <a href="/workflows" class="nav-item"><span class="nav-dot"></span> Workflows</a>
        <a href="/scheduler" class="nav-item"><span class="nav-dot"></span> Scheduler</a>
        <a href="/mcp" class="nav-item"><span class="nav-dot"></span> MCP Registry</a>
        <a href="/loot" class="nav-item"><span class="nav-dot"></span> Loot</a>
        <a href="/files" class="nav-item active"><span class="nav-dot"></span> Files</a>
      </div>
      <div class="sidebar-foot"><span class="live-dot" aria-hidden="true"></span><span class="muted">Live</span></div>
    </nav>

    <div class="files-main">
      <header class="files-topbar">
        <div><h1>Files</h1><p id="path-hint">Project root</p></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn btn-sm" onclick="showNewFolderModal()">+ Folder</button>
          <button class="btn btn-sm" onclick="document.getElementById('file-input').click()">+ Upload</button>
          <input type="file" id="file-input" multiple hidden onchange="handleFileSelect(event)" />
        </div>
      </header>

      <nav class="breadcrumb" id="breadcrumb"></nav>

      <div class="dropzone" id="dropzone">
        <div class="dzicon">↑</div>
        <div>Drop files here or click to upload</div>
        <div class="muted" style="font-size:11px;margin-top:4px">Max 50 MB per file</div>
      </div>

      <div class="files-toolbar">
        <div class="search-box">
          <input type="text" id="search-input" placeholder="Search files..." onkeydown="if(event.key==='Enter')doSearch()" />
        </div>
        <button class="btn btn-sm" onclick="doSearch()">Search</button>
        <button class="btn btn-sm" onclick="clearSearch()">Clear</button>
        <div class="view-toggle" style="margin-left:auto">
          <button id="list-view-btn" class="active" onclick="setView('list')">☰</button>
          <button id="grid-view-btn" onclick="setView('grid')">⊞</button>
        </div>
      </div>

      <div id="files-container">
        <div class="files-header"><span>Name</span><span>Size</span><span>Modified</span><span></span></div>
        <div id="file-list"></div>
      </div>

      <div id="preview-area"></div>
    </div>
  </div>

  <div class="modal-overlay hidden" id="new-folder-modal">
    <div class="modal">
      <h3>Create New Folder</h3>
      <div class="row">
        <label>Folder name</label>
        <input type="text" id="new-folder-name" placeholder="new-folder" maxlength="128" />
      </div>
      <div class="btn-row">
        <button class="btn btn-sm" onclick="hideModal('new-folder-modal')">Cancel</button>
        <button class="btn btn-sm" style="background:rgba(34,197,94,.15);border-color:rgba(34,197,94,.3);color:#BBF7D0" onclick="createFolder()">Create</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay hidden" id="delete-modal">
    <div class="modal">
      <h3>Delete Item</h3>
      <p id="delete-msg" class="muted"></p>
      <div class="btn-row">
        <button class="btn btn-sm" onclick="hideModal('delete-modal')">Cancel</button>
        <button class="btn btn-sm btn-danger" onclick="confirmDelete()">Delete</button>
      </div>
    </div>
  </div>

  <script>
    let currentPath = '';
    let currentView = 'list';
    let selectedFiles = new Set();
    let deleteTarget = null;
    let fileCache = {};

    const ICONS = {
      folder: '📁', text: '📄', md: '📝', py: '🐍', js: '📜', ts: '📜',
      json: '🔧', yaml: '📋', yml: '📋', html: '🌐', css: '🎨',
      png: '🖼️', jpg: '🖼️', jpeg: '🖼️', gif: '🖼️', svg: '🖼️', webp: '🖼️',
      mp4: '🎬', webm: '🎬', mp3: '🎵', wav: '🎵', ogg: '🎵',
      zip: '📦', tar: '📦', gz: '📦', pdf: '📕',
      default: '📄'
    };

    function getIcon(name) {
      const ext = '.' + name.split('.').pop().toLowerCase();
      return ICONS[ext] || ICONS[name.endsWith('folder') ? 'folder' : 'default'];
    }

    function formatSize(bytes) {
      if (bytes === 0) return '—';
      const units = ['B', 'KB', 'MB', 'GB'];
      let i = 0;
      while (bytes >= 1024 && i < units.length - 1) { bytes /= 1024; i++; }
      return bytes.toFixed(i ? 1 : 0) + ' ' + units[i];
    }

    function formatDate(ts) {
      if (!ts) return '—';
      return new Date(ts * 1000).toLocaleString();
    }

    function escHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function showToast(msg, type='ok') {
      const t = document.createElement('div');
      t.className = 'toast ' + type;
      t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 3000);
    }

    function showNewFolderModal() {
      document.getElementById('new-folder-name').value = '';
      document.getElementById('new-folder-modal').classList.remove('hidden');
      setTimeout(() => document.getElementById('new-folder-name').focus(), 50);
    }

    function hideModal(id) { document.getElementById(id).classList.add('hidden'); }

    async function createFolder() {
      const name = document.getElementById('new-folder-name').value.trim();
      if (!name) { showToast('Enter a folder name', 'err'); return; }
      const path = currentPath ? currentPath + '/' + name : name;
      try {
        const r = await fetch('/api/files/mkdir', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({path})
        });
        const d = await r.json();
        if (d.ok) { showToast('Folder created'); loadFiles(); }
        else showToast(d.error || 'Failed', 'err');
      } catch(e) { showToast('Network error', 'err'); }
      hideModal('new-folder-modal');
    }

    function showDeleteModal(name, path) {
      deleteTarget = {name, path};
      document.getElementById('delete-msg').textContent = `Delete "${name}"? This cannot be undone.`;
      document.getElementById('delete-modal').classList.remove('hidden');
    }

    async function confirmDelete() {
      if (!deleteTarget) return;
      try {
        const r = await fetch('/api/files/delete?path=' + encodeURIComponent(deleteTarget.path), {method:'DELETE'});
        const d = await r.json();
        if (d.ok) { showToast('Deleted'); loadFiles(); }
        else showToast(d.error || 'Failed', 'err');
      } catch(e) { showToast('Network error', 'err'); }
      hideModal('delete-modal');
      deleteTarget = null;
    }

    async function loadFiles(path) {
      if (path !== undefined) currentPath = path;
      fileCache = {};
      selectedFiles.clear();
      updateBreadcrumb();
      document.getElementById('path-hint').textContent = currentPath || 'Project root';

      try {
        const r = await fetch('/api/files/list?path=' + encodeURIComponent(currentPath));
        const d = await r.json();
        if (d.error) { showToast(d.error, 'err'); return; }
        renderFiles(d.items || []);
      } catch(e) { showToast('Failed to load files', 'err'); }
    }

    function updateBreadcrumb() {
      const parts = currentPath ? currentPath.split('/') : [''];
      const bc = document.getElementById('breadcrumb');
      bc.innerHTML = parts.map((p, i) => {
        if (i === parts.length - 1) return `<span class="cur">${escHtml(p || 'Root')}</span>`;
        const subPath = parts.slice(0, i + 1).join('/');
        return `<a href="#" onclick="event.preventDefault();loadFiles(${JSON.stringify(subPath)})">${escHtml(p || 'Root')}</a><span class="sep">›</span>`;
      }).join('');
    }

    function renderFiles(items) {
      const list = document.getElementById('file-list');
      if (!items.length) {
        list.innerHTML = '<div class="empty-state"><div class="eicon">📂</div><div>No files here</div></div>';
        return;
      }
      const sorted = [...items].sort((a,b) => {
        if (a.type === 'dir' && b.type !== 'dir') return -1;
        if (a.type !== 'dir' && b.type === 'dir') return 1;
        return a.name.localeCompare(b.name);
      });
      if (currentView === 'list') {
        list.className = '';
        list.innerHTML = sorted.map(f => `
          <div class="file-row" data-name="${escAttr(escHtml(f.name))}" data-type="${escAttr(escHtml(f.type))}"
               onclick="selectFile(this,'${escHtml(f.name)}','${escHtml(f.type || '')}')"
               ondblclick="openItem('${escHtml(f.name)}','${escHtml(f.type || '')}')">
            <div class="fname">
              <span class="ficon">${f.type === 'dir' ? '📁' : escHtml(getIcon(f.name))}</span>
              <span class="fnm">${escHtml(f.name)}</span>
            </div>
            <div class="fsize">${f.type === 'dir' ? '<span class="muted">' + (f.items||0) + ' items</span>' : escHtml(formatSize(f.size))}</div>
            <div class="fdate">${escHtml(formatDate(f.modified))}</div>
            <div class="factions">
              ${f.type !== 'dir' ? `<button class="btn btn-sm" style="padding:4px 8px;font-size:11px" onclick="event.stopPropagation();downloadFile('${escHtml(currentPath ? currentPath + '/' + f.name : f.name)}')">↓</button>` : ''}
              <button class="btn btn-sm btn-danger" style="padding:4px 8px;font-size:11px" onclick="event.stopPropagation();showDeleteModal('${escHtml(f.name)}','${escHtml(currentPath ? currentPath + '/' + f.name : f.name)}')">✕</button>
            </div>
          </div>`).join('');
      } else {
        list.className = 'file-grid';
        list.innerHTML = sorted.map(f => `
          <div class="file-card" onclick="selectFile(this,'${escHtml(f.name)}','${escHtml(f.type || '')}')"
               ondblclick="openItem('${escHtml(f.name)}','${escHtml(f.type || '')}')">
            <div class="gicon">${f.type === 'dir' ? '📁' : escHtml(getIcon(f.name))}</div>
            <div class="gnm">${escHtml(f.name)}</div>
            <div class="gmeta">${f.type === 'dir' ? (f.items||0) + ' items' : escHtml(formatSize(f.size))}</div>
          </div>`).join('');
      }
      document.getElementById('preview-area').innerHTML = '';
    }

    function selectFile(el, name, type) {
      if (event && event.shiftKey) {
        if (selectedFiles.has(name)) selectedFiles.delete(name);
        else selectedFiles.add(name);
        document.querySelectorAll('.file-row,.file-card').forEach(e => e.classList.remove('selected'));
        document.querySelectorAll('.file-row.selected,.file-card.selected').forEach(e => {
          const n = e.dataset.name; if (n && selectedFiles.has(n)) e.classList.add('selected');
        });
        return;
      }
      selectedFiles.clear();
      document.querySelectorAll('.file-row.selected,.file-card.selected').forEach(e => e.classList.remove('selected'));
      el.classList.add('selected');
      selectedFiles.add(name);
      if (type !== 'dir') openPreview(name);
    }

    function openItem(name, type) {
      const full = currentPath ? currentPath + '/' + name : name;
      if (type === 'dir') { loadFiles(full); return; }
      openPreview(name, full);
    }

    async function openPreview(name, fullPath) {
      const fp = fullPath || (currentPath ? currentPath + '/' + name : name);
      try {
        const r = await fetch('/api/files/read?path=' + encodeURIComponent(fp));
        const d = await r.json();
        if (d.error) { showToast(d.error, 'err'); return; }
        const area = document.getElementById('preview-area');
        const ext = '.' + name.split('.').pop().toLowerCase();
        const isImage = /\.(png|jpg|jpeg|gif|svg|webp|ico|bmp)$/i.test(name);
        if (isImage) {
          area.innerHTML = `<div class="preview-panel"><div class="preview-head"><span class="pname">🖼️ ${escHtml(name)}</span><button class="btn btn-sm" onclick="downloadFile('${escHtml(fp)}')">↓ Download</button></div><div class="preview-body"><img src="/api/files/read?path=${encodeURIComponent(fp)}&thumb=1" alt="${escHtml(name)}" /></div></div>`;
        } else if (d.content !== undefined) {
          area.innerHTML = `<div class="preview-panel"><div class="preview-head"><span class="pname">📄 ${escHtml(name)}</span><div style="display:flex;gap:6px"><button class="btn btn-sm" onclick="downloadFile('${escHtml(fp)}')">↓ Download</button><button class="btn btn-sm" onclick="copyContent()">📋 Copy</button></div></div><div class="preview-body"><pre id="preview-content">${escHtml(d.content)}</pre></div></div>`;
        } else {
          area.innerHTML = `<div class="preview-panel"><div class="preview-head"><span class="pname">📄 ${escHtml(name)}</span></div><div class="preview-body"><div class="binary-hint">Binary file — use download button</div></div></div>`;
        }
      } catch(e) { showToast('Failed to preview', 'err'); }
    }

    function copyContent() {
      const el = document.getElementById('preview-content');
      if (el) { navigator.clipboard.writeText(el.textContent); showToast('Copied!'); }
    }

    function downloadFile(path) {
      window.open('/api/files/read?path=' + encodeURIComponent(path) + '&download=1', '_blank');
    }

    function setView(v) {
      currentView = v;
      document.getElementById('list-view-btn').classList.toggle('active', v === 'list');
      document.getElementById('grid-view-btn').classList.toggle('active', v === 'grid');
      const header = document.querySelector('.files-header');
      if (header) header.style.display = v === 'list' ? '' : 'none';
      loadFiles();
    }

    async function doSearch() {
      const q = document.getElementById('search-input').value.trim();
      if (!q) return;
      try {
        const r = await fetch('/api/files/search?q=' + encodeURIComponent(q) + '&path=' + encodeURIComponent(currentPath));
        const d = await r.json();
        if (d.error) { showToast(d.error, 'err'); return; }
        const list = document.getElementById('file-list');
        list.className = '';
        if (!d.results.length) { list.innerHTML = '<div class="empty-state"><div class="eicon">🔍</div><div>No results for "' + escHtml(q) + '"</div></div>'; return; }
        list.innerHTML = d.results.map(f => `
          <div class="file-row" data-name="${escAttr(escHtml(f.name))}" data-type="${escAttr(escHtml(f.type||'file'))}">
            <div class="fname"><span class="ficon">${f.type==='dir'?'📁':escHtml(getIcon(f.name))}</span><span class="fnm">${escHtml(f.name)}</span></div>
            <div class="fsize">${f.type==='dir'?'<span class="muted">'+(f.items||0)+' items</span>':escHtml(formatSize(f.size))}</div>
            <div class="fdate">${escHtml(formatDate(f.modified))}</div>
            <div class="factions">
              ${f.type!=='dir'?`<button class="btn btn-sm" style="padding:4px 8px;font-size:11px" onclick="event.stopPropagation();downloadFile('${escHtml(f.path)}')">↓</button>`:''}
              <button class="btn btn-sm btn-danger" style="padding:4px 8px;font-size:11px" onclick="event.stopPropagation();showDeleteModal('${escHtml(f.name)}','${escHtml(f.path)}')">✕</button>
            </div>
          </div>`).join('');
      } catch(e) { showToast('Search failed', 'err'); }
    }

    function clearSearch() {
      document.getElementById('search-input').value = '';
      loadFiles();
    }

    // Upload via button
    function handleFileSelect(e) { uploadFiles(e.target.files); e.target.value = ''; }

    // Drag and drop
    const dropzone = document.getElementById('dropzone');
    dropzone.addEventListener('click', () => document.getElementById('file-input').click());
    dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('over'); });
    dropzone.addEventListener('dragleave', () => dropzone.classList.remove('over'));
    dropzone.addEventListener('drop', e => {
      e.preventDefault();
      dropzone.classList.remove('over');
      uploadFiles(e.dataTransfer.files);
    });

    async function uploadFiles(files) {
      if (!files.length) return;
      showToast('Uploading ' + files.length + ' file(s)...');
      for (const file of files) {
        const fd = new FormData();
        fd.append('file', file);
        if (currentPath) fd.append('path', currentPath);
        try {
          const r = await fetch('/api/files/upload', {method:'POST', body:fd});
          const d = await r.json();
          if (d.ok) showToast('Uploaded: ' + file.name);
          else showToast(d.error || 'Upload failed', 'err');
        } catch(err) { showToast('Upload error', 'err'); }
      }
      loadFiles();
    }

    // Keyboard shortcuts
    document.addEventListener('keydown', e => {
      if (e.key === 'Backspace' && !['INPUT','TEXTAREA'].includes(document.activeElement.tagName) && currentPath) {
        const parts = currentPath.split('/'); parts.pop(); currentPath = parts.join('/'); loadFiles();
      }
      if (e.key === 'Delete' && selectedFiles.size) {
        selectedFiles.forEach(name => { const full = currentPath ? currentPath + '/' + name : name; showDeleteModal(name, full); });
      }
    });

    function escAttr(s) { return s.replace(/'/g, "\\'"); }
    loadFiles();
  </script>
</body>
</html>
