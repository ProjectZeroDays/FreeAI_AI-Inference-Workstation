<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FreeAI — MCP Registry</title>
  <link rel="stylesheet" href="/static/dashboard.css" />
  <style>
    .mcp-layout { display:grid; grid-template-columns:260px 1fr; min-height:100vh; }
    .mcp-main { padding:22px 24px 32px; min-width:0; }
    .mcp-topbar { display:flex; align-items:center; justify-content:space-between;
                  padding:6px 2px 16px; border-bottom:1px solid var(--border);
                  margin-bottom:18px; flex-wrap:wrap; gap:10px; }
    .mcp-topbar h1 { margin:0; font-size:22px; letter-spacing:-.02em; }
    .mcp-topbar p { margin:4px 0 0; color:var(--muted); font-size:13px; }
    .mcp-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(300px,1fr)); gap:14px; }
    .mcp-card {
      background:linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.02));
      border:1px solid var(--border); border-radius:14px; padding:16px;
      transition:border-color .18s ease, transform .18s ease;
    }
    .mcp-card:hover { border-color:var(--border-strong); transform:translateY(-2px); }
    .mcp-card-head { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
    .mcp-icon { width:36px; height:36px; border-radius:10px; display:grid; place-items:center;
                background:linear-gradient(135deg, rgba(168,85,247,.2), rgba(56,189,248,.2));
                color:#a855f7; font-size:16px; flex-shrink:0; }
    .mcp-title { font-size:15px; font-weight:600; color:var(--text); }
    .mcp-path { font-size:11px; color:var(--muted-2); font-family:'JetBrains Mono',monospace; }
    .mcp-desc { font-size:12px; color:var(--muted); line-height:1.5; margin:8px 0; }
    .mcp-actions { display:flex; gap:6px; margin-top:10px; }
    .mcp-actions button { padding:5px 10px; border-radius:8px; border:1px solid var(--border);
                          background:var(--panel-2); color:var(--muted); cursor:pointer;
                          font-size:12px; transition:all .15s; }
    .mcp-actions button:hover { border-color:var(--accent-2); color:var(--text); }
    .mcp-actions button.danger:hover { border-color:var(--danger); color:var(--danger); }
    .register-section { background:rgba(255,255,255,.03); border:1px solid var(--border);
                        border-radius:12px; padding:16px; margin-top:18px; }
    .register-section h3 { margin:0 0 12px; font-size:14px; }
    .reg-form { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .reg-form .full { grid-column:1/-1; }
    .reg-form input { background:rgba(2,6,23,.55); color:var(--text);
                      border:1px solid var(--border); border-radius:10px;
                      padding:8px 12px; font-size:13px; font-family:Inter,system-ui,sans-serif; }
    .reg-form input:focus { outline:none; border-color:rgba(56,189,248,.45);
                            box-shadow:0 0 0 3px rgba(56,189,248,.12); }
    .reg-form textarea { background:rgba(2,6,23,.55); color:var(--text);
                         border:1px solid var(--border); border-radius:10px;
                         padding:8px 12px; font-size:13px; resize:vertical;
                         font-family:'JetBrains Mono',monospace; min-height:80px; }
    .reg-form textarea:focus { outline:none; border-color:rgba(56,189,248,.45);
                               box-shadow:0 0 0 3px rgba(56,189,248,.12); }
    .empty-state { text-align:center; padding:60px 20px; color:var(--muted); grid-column:1/-1; }
    .search-box { background:rgba(2,6,23,.55); color:var(--text); border:1px solid var(--border);
                  border-radius:10px; padding:7px 12px; font-size:13px; width:220px;
                  font-family:Inter,system-ui,sans-serif; }
    .search-box:focus { outline:none; border-color:rgba(56,189,248,.45);
                        box-shadow:0 0 0 3px rgba(56,189,248,.12); }
    .toast { position:fixed; bottom:24px; right:24px; background:var(--panel);
             border:1px solid var(--border); border-radius:12px; padding:12px 18px;
             font-size:13px; color:var(--text); box-shadow:var(--shadow);
             transform:translateY(80px); opacity:0; transition:all .25s ease; z-index:999; }
    .toast.show { transform:translateY(0); opacity:1; }
    .toast.success { border-color:rgba(34,197,94,.4); }
    .toast.error { border-color:rgba(239,68,68,.4); }
  </style>
</head>
<body>
  <div class="mcp-layout">
    <nav class="sidebar" aria-label="Primary">
      <div class="brand">
        <div class="brand-mark">◈</div>
        <div class="brand-text"><strong>FreeAI</strong><span>MCP Registry</span></div>
      </div>
      <div class="nav-section">
        <span class="nav-label">Navigation</span>
        <a href="/" class="nav-item"><span class="nav-dot"></span> Dashboard</a>
        <a href="/skills" class="nav-item"><span class="nav-dot"></span> Skills</a>
        <a href="/providers" class="nav-item"><span class="nav-dot"></span> Providers</a>
        <a href="/hermes" class="nav-item"><span class="nav-dot"></span> Hermes</a>
        <a href="/workflows" class="nav-item"><span class="nav-dot"></span> Workflows</a>
        <a href="/scheduler" class="nav-item"><span class="nav-dot"></span> Scheduler</a>
        <a href="/mcp" class="nav-item active"><span class="nav-dot"></span> MCP Registry</a>
        <a href="/subagents" class="nav-item"><span class="nav-dot"></span> Subagents</a>
      </div>
      <div class="nav-section">
        <span class="nav-label">Tools</span>
        <a href="/settings" class="nav-item"><span class="nav-dot"></span> Settings</a>
        <a href="/logs" class="nav-item"><span class="nav-dot"></span> Logs</a>
      </div>
      <div class="sidebar-foot">
        <span class="live-dot" aria-hidden="true"></span>
        <span class="muted">Live</span>
        <span id="mcp-count" class="muted" style="margin-left:auto">0 servers</span>
      </div>
    </nav>

    <div class="mcp-main">
      <header class="mcp-topbar">
        <div>
          <h1>MCP Server Registry</h1>
          <p>Model Context Protocol servers — discover, register, and manage tools</p>
        </div>
        <div style="display:flex;gap:10px;align-items:center">
          <input type="text" class="search-box" id="search" placeholder="Search servers…" />
          <button class="btn" id="btn-refresh">↻ Refresh</button>
        </div>
      </header>

      <div class="mcp-grid" id="mcp-grid">
        <div class="empty-state"><div style="font-size:40px;opacity:.4;margin-bottom:12px">◈</div><p>Loading MCP servers…</p></div>
      </div>

      <div class="register-section">
        <h3>Register New MCP Server</h3>
        <div class="reg-form">
          <input type="text" id="reg-name" placeholder="Server name (e.g. filesystem)" />
          <input type="text" id="reg-command" placeholder="Command (e.g. npx, python, node)" />
          <input type="text" id="reg-args" placeholder="Args (space-separated)" class="full" />
          <textarea id="reg-desc" placeholder="Description of what this server provides…" class="full"></textarea>
          <button class="btn btn-primary" id="btn-register" style="grid-column:1/-1;justify-self:start">Register Server</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const $ = id => document.getElementById(id);
    function toast(msg, type='success') {
      const t = $('toast'); t.textContent = msg; t.className = 'toast show ' + type;
      setTimeout(() => t.classList.remove('show'), 3000);
    }
    function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

    let servers = [];

    async function load() {
      try {
        const r = await fetch('/api/mcp');
        if (!r.ok) throw new Error(r.statusText);
        const d = await r.json();
        servers = d.servers || [];
        $('mcp-count').textContent = servers.length + ' servers';
        render(servers);
      } catch(e) {
        $('mcp-grid').innerHTML = `<div class="empty-state" style="grid-column:1/-1"><p>Error: ${esc(e.message)}</p></div>`;
      }
    }

    function render(items, filter='') {
      const grid = $('mcp-grid');
      const filtered = filter
        ? items.filter(s => s.name.toLowerCase().includes(filter) || (s.description||'').toLowerCase().includes(filter))
        : items;
      if (!filtered.length) {
        grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1">
          <div style="font-size:40px;opacity:.4;margin-bottom:12px">◈</div>
          <p>${filter ? 'No servers match your search.' : 'No MCP servers found. Register one below or add a directory under mcp/servers/.'}</p>
        </div>`;
        return;
      }
      grid.innerHTML = filtered.map(s => `
        <div class="mcp-card">
          <div class="mcp-card-head">
            <div class="mcp-icon">⬡</div>
            <div style="flex:1;min-width:0">
              <div class="mcp-title">${esc(s.name)}</div>
              <div class="mcp-path">${esc(s.path || '')}</div>
            </div>
          </div>
          <div class="mcp-desc">${esc(s.description || 'No description.')}</div>
          <div class="mcp-actions">
            <span class="job-status ${s.enabled ? 'enabled' : 'disabled'}" style="font-size:11px">
              <span style="width:6px;height:6px;border-radius:50%;background:currentColor"></span>
              ${s.enabled ? 'Enabled' : 'Disabled'}
            </span>
          </div>
        </div>
      `).join('');
    }

    $('btn-register').addEventListener('click', async () => {
      const name = $('reg-name').value.trim();
      const command = $('reg-command').value.trim();
      const args = $('reg-args').value.trim().split(/\s+/).filter(Boolean);
      if (!name || !command) { toast('Name and command are required', 'error'); return; }
      try {
        const r = await fetch('/api/mcp/register', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({name, command, args}),
        });
        const d = await r.json();
        if (d.ok) {
          toast(`Registered "${name}"`);
          $('reg-name').value = ''; $('reg-command').value = '';
          $('reg-args').value = ''; $('reg-desc').value = '';
          load();
        } else toast(d.error || 'Registration failed', 'error');
      } catch(e) { toast('Network error: ' + e.message, 'error'); }
    });

    $('search').addEventListener('input', e => render(servers, e.target.value));
    $('btn-refresh').addEventListener('click', load);

    load();
    setInterval(load, 60000);
  </script>
</body>
</html>
