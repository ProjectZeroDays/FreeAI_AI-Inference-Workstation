<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FreeAI — Settings</title>
  <link rel="stylesheet" href="/static/dashboard.css" />
</head>
<body>
  <div class="layout">
    <nav class="sidebar" aria-label="Primary">
      <div class="brand"><div class="brand-mark">\u25c8</div><div class="brand-text"><strong>FreeAI</strong><span>Unified GPU Stack</span></div></div>
      <div class="nav-section"><span class="nav-label">Stack</span>
        <a href="/" class="nav-item"><span class="nav-dot"></span> <span data-i18n="nav.dashboard">Dashboard</span></a>
        <a href="/hot-models" class="nav-item"><span class="nav-dot"></span> <span data-i18n="nav.models">Models</span></a>
        <a href="/config" class="nav-item"><span class="nav-dot"></span> <span data-i18n="nav.config">Config</span></a>
      </div>
      <div class="nav-section"><span class="nav-label">Control</span>
        <a href="/config" class="nav-item active"><span class="nav-dot"></span> Settings</a>
        <a href="/skills" class="nav-item"><span class="nav-dot"></span> <span data-i18n="nav.skills">Skills</span></a>
        <a href="/files" class="nav-item"><span class="nav-dot"></span> <span data-i18n="nav.files">Files</span></a>
      </div>
      <div class="sidebar-foot">
        <button class="sidebar-toggle" id="sidebar-toggle" title="Toggle sidebar" aria-label="Toggle sidebar"><span class="toggle-icon">\u25c0</span></button>
        <button class="theme-toggle" id="sidebar-theme-toggle" title="Toggle theme" aria-label="Toggle theme">\u25d0</button>
        <span class="live-dot" aria-hidden="true"></span><span class="muted">Live</span>
      </div>
    </nav>
    <div class="main">
      <header class="topbar">
        <div><h1>Settings</h1><p>Application configuration and preferences</p></div>
        <div class="topbar-actions"><button class="theme-toggle" id="theme-toggle" title="Toggle theme">\u2600</button></div>
      </header>
      <main>
        <div class="q-card">
          <div class="card-header"><h3>General</h3></div>
          <div class="card-body">
            <p class="muted">Application-wide settings managed via config files.</p>
          </div>
        </div>
        <div class="q-card">
          <div class="card-header"><h3>Theme</h3></div>
          <div class="card-body">
            <p class="muted">Use the theme toggle in the sidebar to switch between dark and light mode.</p>
          </div>
        </div>
      </main>
    </div>
  </div>
  <script src="/static/dashboard.js"></script>
  <script><script>
    (function(){
      var btn = document.getElementById('sidebar-theme-toggle');
      if (!btn) return;
      var KEY = 'freeai-theme';
      function apply(dark) {
        document.body.classList.toggle('light', !dark);
        btn.textContent = dark ? '\u25d0' : '\u25d1';
        localStorage.setItem(KEY, dark ? 'dark' : 'light');
      }
      var saved = localStorage.getItem(KEY);
      apply(saved !== 'light');
      btn.addEventListener('click', function() {
        apply(!document.body.classList.contains('light'));
      });
    })();
  </script></script>
</body>
</html>
