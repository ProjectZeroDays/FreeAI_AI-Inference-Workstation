[SERVICE]
    Parsers_File parsers.conf
    Daemon off
    Log_Level info
    Flush         1
    Log_File      /tmp/fluentbit.log
    HTTP_Server   On
    HTTP_Listen   0.0.0.0
    HTTP_Port     2020

[INPUT]
    Name          tail
    Path          /logs/*.log
    Tag           freeai.logs.*
    Parser        json
    DB            /tmp/fluentbit.db
    Mem_Buf_Limit 5MB
    Skip_Long_Lines On
    Refresh_Interval 5
    Rotate_Wait   30
    Retry_Limit   False

[INPUT]
    Name          systemd
    Tag           freeai.systemd.*
    Systemd_Filter _SYSTEMD_UNIT = router.service
    Systemd_Filter _SYSTEMD_UNIT = dashboard.service
    DB            /tmp/fluentbit-systemd.db
    Path          /proc/self/fd/1

[INPUT]
    Name          stdin
    Tag           freeai.stdin.*
    Refresh_Interval 10

[FILTER]
    Name          parser
    Match         freeai.logs.*
    Key_Name      log
    Parser        json
    Reserve_Data  On

[FILTER]
    Name          modify
    Match         freeai.logs.*
    Add           service_name  freeai-router
    Add           cluster       freeai-workstation
    Add           env           development
    Remove_Header host_name

[FILTER]
    Name          modify
    Match         freeai.systemd.*
    Add           service_name  freeai-systemd
    Add           cluster       freeai-workstation
    Add           env           development

[FILTER]
    Name          record_modifier
    Match         freeai.*
    Remove_Key    __NULL__
    Whitespace    underscore

[OUTPUT]
    Name          loki
    Match         freeai.*
    Host          loki
    Port          3100
    URI           /loki/api/v1/push
    tenant_id     freeai
    remove_labels Off
    auto_k8s_labels    On
    k8s-labels_use_regex  Off

[OUTPUT]
    Name            stdout
    Match           freeai.logs.*
    Format          json
    JSON_Date_Key   timestamp
    JSON_Date_Keep  On
    Header          Host freeai-stdout
    Tap             stderr
