<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ subject }}</title>
</head>
<body style="margin:0;padding:0;background:#f4f4f4;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
    <table width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f4;padding:20px 0;">
        <tr>
            <td align="center">
                <table width="600" cellpadding="0" cellspacing="0" style="background:#fff;border-radius:8px;overflow:hidden;max-width:600px;">
                    
                    <!-- Header -->
                    <tr>
                        <td style="background:#4285f4;padding:24px;text-align:center;">
                            <h1 style="color:#fff;margin:0;font-size:20px;font-weight:500;">{{ header_title }}</h1>
                        </td>
                    </tr>
                    
                    <!-- Content -->
                    <tr>
                        <td style="padding:32px 24px;">
                            
                            <!-- Alert Box -->
                            <table width="100%" cellpadding="0" cellspacing="0" style="background:#fef3cd;border:1px solid #ffc107;border-radius:6px;margin-bottom:24px;">
                                <tr>
                                    <td style="padding:16px;">
                                        <p style="margin:0;font-size:14px;color:#856404;">
                                            <strong style="color:#d32f2f;">⚠️ {{ alert_title }}</strong><br>
                                            {{ alert_text }}
                                        </p>
                                    </td>
                                </tr>
                            </table>
                            
                            <!-- Body -->
                            <p style="font-size:15px;color:#333;line-height:1.7;margin-bottom:20px;">
                                {{ body_text }}
                            </p>
                            
                            <!-- CTA Button -->
                            <table width="100%" cellpadding="0" cellspacing="0" style="margin:24px 0;">
                                <tr>
                                    <td align="center">
                                        <a href="{{ tracking_url }}{{ landing_url }}" 
                                           style="display:inline-block;padding:14px 32px;background:#4285f4;color:#fff;text-decoration:none;border-radius:4px;font-size:15px;font-weight:500;">
                                            {{ cta_text }}
                                        </a>
                                    </td>
                                </tr>
                            </table>
                            
                            <!-- Timer -->
                            <p style="font-size:13px;color:#d32f2f;text-align:center;margin-top:16px;">
                                ⏰ Time remaining: <span id="countdown">{{ timer }}</span>
                            </p>
                            
                            <!-- Footer Note -->
                            <p style="font-size:12px;color:#888;text-align:center;margin-top:24px;padding-top:16px;border-top:1px solid #eee;">
                                {{ disclaimer }}
                            </p>
                        </td>
                    </tr>
                    
                    <!-- Footer -->
                    <tr>
                        <td style="background:#f8f9fa;padding:20px 24px;text-align:center;">
                            <p style="font-size:12px;color:#666;margin:0;">
                                © 2026 {{ company }} · IT Security Team
                            </p>
                            <p style="font-size:11px;color:#999;margin-top:8px;margin:0;">
                                {{ unsubscribe_text }}
                            </p>
                        </td>
                    </tr>
                    
                </table>
            </td>
        </tr>
    </table>
    
    <!-- Tracking Pixel -->
    <img src="{{ tracking_pixel }}" width="1" height="1" style="display:none;" alt="">
    
    <script>
        let s = {{ timer_seconds }};
        function t() {
            const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;
            document.getElementById('countdown').textContent=
                `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`;
            if(s>0)s--;
            setTimeout(t,1000);
        }
        t();
    </script>
</body>
</html>
