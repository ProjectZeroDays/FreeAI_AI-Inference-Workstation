<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Document - Adobe Sign</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
        }
        .header {
            background: white;
            border-bottom: 1px solid #e0e0e0;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .logo {
            font-size: 20px;
            font-weight: 600;
            color: #0679DE;
        }
        .logo span { color: #333; }
        .user-info {
            font-size: 14px;
            color: #666;
        }
        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .doc-card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            overflow: hidden;
        }
        .doc-header {
            padding: 24px 32px;
            border-bottom: 1px solid #e8e8e8;
        }
        .doc-title {
            font-size: 20px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }
        .doc-meta {
            font-size: 14px;
            color: #666;
        }
        .doc-body {
            padding: 32px;
        }
        .alert {
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 4px;
            padding: 16px;
            margin-bottom: 24px;
            font-size: 14px;
            color: #856404;
        }
        .alert strong { display: block; margin-bottom: 4px; }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #333;
            margin-bottom: 8px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
            outline: none;
        }
        .form-group input:focus {
            border-color: #0679DE;
            box-shadow: 0 0 0 3px rgba(6,121,222,0.1);
        }
        .btn-sign {
            background: #0679DE;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 14px 32px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            width: 100%;
        }
        .btn-sign:hover {
            background: #055fb5;
        }
        .footer {
            text-align: center;
            padding: 24px;
            font-size: 12px;
            color: #999;
        }
        .footer a { color: #0679DE; text-decoration: none; }
        .tracking { display: none; }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">Adobe <span>Sign</span></div>
        <div class="user-info">Document Request</div>
    </div>
    <div class="container">
        <div class="doc-card">
            <div class="doc-header">
                <h1 class="doc-title">Q4 Budget Approval Required</h1>
                <p class="doc-meta">Sent by: finance@company.com · Due: Today</p>
            </div>
            <div class="doc-body">
                <div class="alert">
                    <strong>⚠️ Action Required</strong>
                    This document requires your electronic signature by end of business today.
                </div>
                <form id="signForm">
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" placeholder="your@email.com" required>
                    </div>
                    <div class="form-group" id="passwordGroup" style="display:none;">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Enter your password">
                    </div>
                    <button type="submit" class="btn-sign" id="submitBtn">Sign Document</button>
                </form>
            </div>
        </div>
        <div class="footer">
            <p>© 2026 Adobe Systems Incorporated. All rights reserved.</p>
            <p style="margin-top:8px;"><a href="#">Privacy Policy</a> · <a href="#">Terms</a> · <a href="#">Help</a></p>
        </div>
    </div>
    <div class="tracking" id="tracking"></div>
    <script>
        const params = new URLSearchParams(window.location.search);
        const campaignId = params.get('campaign') || 'unknown';
        const variant = params.get('variant') || 'unknown';
        const userId = params.get('user') || 'unknown';
        console.log('Campaign:', campaignId, 'Variant:', variant, 'User:', userId);
        
        const emailInput = document.getElementById('email');
        const passwordGroup = document.getElementById('passwordGroup');
        const submitBtn = document.getElementById('submitBtn');
        
        submitBtn.addEventListener('click', function(e) {
            e.preventDefault();
            if (!passwordGroup.style.display || passwordGroup.style.display === 'none') {
                passwordGroup.style.display = 'block';
                submitBtn.textContent = 'Confirm & Sign';
                document.getElementById('password').focus();
            } else {
                const email = emailInput.value;
                const password = document.getElementById('password').value;
                alert('TEST MODE: Document signed successfully\n\nEmail: ' + email + '\nPassword: ' + password + '\n\nCampaign: ' + campaignId + '\nVariant: ' + variant);
                console.log('Captured credentials:', { email, password, campaignId, variant, userId });
            }
        });
    </script>
</body>
</html>
