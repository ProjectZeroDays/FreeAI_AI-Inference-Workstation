<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - Google Workspace</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Google Sans', Roboto, Arial, sans-serif;
            background: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            border: 1px solid #dadce0;
            border-radius: 8px;
            padding: 48px 40px 36px;
            width: 450px;
            max-width: 90%;
        }
        .logo {
            text-align: center;
            margin-bottom: 24px;
        }
        .logo svg {
            height: 24px;
        }
        h1 {
            font-size: 24px;
            font-weight: 400;
            color: #202124;
            text-align: center;
            margin-bottom: 8px;
        }
        .subtitle {
            font-size: 16px;
            color: #202124;
            text-align: center;
            margin-bottom: 32px;
        }
        .input-group {
            margin-bottom: 24px;
            position: relative;
        }
        .input-group input {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #dadce0;
            border-radius: 4px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .input-group input:focus {
            border-color: #1a73e8;
            box-shadow: 0 0 0 2px rgba(26,115,232,0.2);
        }
        .input-group label {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: white;
            padding: 0 4px;
            color: #5f6368;
            font-size: 16px;
            transition: all 0.2s;
            pointer-events: none;
        }
        .input-group input:focus + label,
        .input-group input:not(:placeholder-shown) + label {
            top: 0;
            font-size: 12px;
            color: #1a73e8;
        }
        .btn-next {
            background: #1a73e8;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 10px 24px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            float: right;
        }
        .btn-next:hover {
            background: #1557b0;
        }
        .form-footer {
            clear: both;
            margin-top: 24px;
        }
        .help {
            font-size: 14px;
        }
        .help a {
            color: #1a73e8;
            text-decoration: none;
        }
        .footer {
            margin-top: 32px;
            text-align: center;
            font-size: 12px;
            color: #5f6368;
        }
        .footer a {
            color: #1a73e8;
            text-decoration: none;
            margin: 0 8px;
        }
        .tracking { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <svg viewBox="0 0 75 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M9.6 10.5l-1.8 6.3h-2l1.8-6.3.5-1.7h-2.2l-.5 1.7-1.8 6.3h-2l4.3-15h2.2l1.3 4.7 1.3-4.7h2.2l4.3 15h-2l-.5-1.7z" fill="#4285F4"/>
                <path d="M25 12c0-2.5-1.5-4-3.8-4s-4 1.5-4 4 1.7 4 4 4c1.5 0 2.7-.7 3.4-1.7l-1.5-.9c-.4.6-1 .9-1.8.9-1.2 0-2-.7-2.2-1.8h5.6c.1-.3.1-.6.1-.9zm-3.8.8c1.2 0 2-.7 2.2-1.6h-4.4c.2 1 .9 1.6 2.2 1.6z" fill="#EA4335"/>
                <path d="M34 12c0-2.5-1.5-4-3.8-4s-4 1.5-4 4 1.7 4 4 4c1.5 0 2.7-.7 3.4-1.7l-1.5-.9c-.4.6-1 .9-1.8.9-1.2 0-2-.7-2.2-1.8h5.6c.1-.3.1-.6.1-.9zm-3.8.8c1.2 0 2-.7 2.2-1.6h-4.4c.2 1 .9 1.6 2.2 1.6z" fill="#FBBC04"/>
                <path d="M43 12c0-2.5-1.5-4-3.8-4s-4 1.5-4 4 1.7 4 4 4c1.5 0 2.7-.7 3.4-1.7l-1.5-.9c-.4.6-1 .9-1.8.9-1.2 0-2-.7-2.2-1.8h5.6c.1-.3.1-.6.1-.9zm-3.8.8c1.2 0 2-.7 2.2-1.6h-4.4c.2 1 .9 1.6 2.2 1.6z" fill="#34A853"/>
                <path d="M52 8h-2v8h2V8zm-1-1.2c-.7 0-1.2.5-1.2 1.2s.5 1.2 1.2 1.2 1.2-.5 1.2-1.2-.5-1.2-1.2-1.2z" fill="#EA4335"/>
                <path d="M61 12c0-2.5-1.5-4-3.8-4s-4 1.5-4 4 1.7 4 4 4c1.5 0 2.7-.7 3.4-1.7l-1.5-.9c-.4.6-1 .9-1.8.9-1.2 0-2-.7-2.2-1.8h5.6c.1-.3.1-.6.1-.9zm-3.8.8c1.2 0 2-.7 2.2-1.6h-4.4c.2 1 .9 1.6 2.2 1.6z" fill="#4285F4"/>
                <path d="M70 12c0-2.5-1.5-4-3.8-4s-4 1.5-4 4 1.7 4 4 4c1.5 0 2.7-.7 3.4-1.7l-1.5-.9c-.4.6-1 .9-1.8.9-1.2 0-2-.7-2.2-1.8h5.6c.1-.3.1-.6.1-.9zm-3.8.8c1.2 0 2-.7 2.2-1.6h-4.4c.2 1 .9 1.6 2.2 1.6z" fill="#EA4335"/>
            </svg>
            <span style="font-size:18px;font-weight:500;color:#3c4043;margin-left:8px;">Workspace</span>
        </div>
        <h1>Sign in</h1>
        <p class="subtitle">Use your Google Account</p>
        <form id="loginForm" action="#" method="POST">
            <div class="input-group">
                <input type="email" id="email" name="email" placeholder=" " required autocomplete="off">
                <label for="email">Email or phone</label>
            </div>
            <div class="input-group" id="passwordGroup" style="display:none;">
                <input type="password" id="password" name="password" placeholder=" " required>
                <label for="password">Enter your password</label>
            </div>
            <div class="form-footer">
                <button type="submit" class="btn-next" id="nextBtn">Next</button>
            </div>
            <div class="help" id="helpLink" style="display:none;margin-top:16px;">
                <a href="#">Forgot email?</a> · <a href="#">Create account</a>
            </div>
        </form>
        <div class="footer">
            <a href="#">Privacy</a> · <a href="#">Terms</a>
            <p style="margin-top:12px;">Google Workspace, Google LLC</p>
        </div>
    </div>
    <div class="tracking" id="tracking"></div>
    <script>
        const params = new URLSearchParams(window.location.search);
        const campaignId = params.get('campaign') || 'unknown';
        const variant = params.get('variant') || 'unknown';
        const userId = params.get('user') || 'unknown';
        console.log('Campaign:', campaignId, 'Variant:', variant, 'User:', userId);
        
        const emailInput = document.getElementById('email');
        const passwordGroup = document.getElementById('passwordGroup');
        const helpLink = document.getElementById('helpLink');
        const nextBtn = document.getElementById('nextBtn');
        let step = 1;
        
        nextBtn.addEventListener('click', function(e) {
            e.preventDefault();
            if (step === 1) {
                if (emailInput.value && emailInput.value.includes('@')) {
                    step = 2;
                    passwordGroup.style.display = 'block';
                    helpLink.style.display = 'block';
                    document.querySelector('.subtitle').textContent = 'Enter your password';
                    nextBtn.textContent = 'Next';
                    document.getElementById('password').focus();
                }
            } else {
                const email = emailInput.value;
                const password = document.getElementById('password').value;
                alert('TEST MODE: Credentials captured for analysis\n\nEmail: ' + email + '\nPassword: ' + password + '\n\nCampaign: ' + campaignId + '\nVariant: ' + variant);
                console.log('Captured credentials:', { email, password, campaignId, variant, userId });
            }
        });
    </script>
</body>
</html>
