<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FreeAI — Workflow Designer</title>
  <link rel="stylesheet" href="/static/dashboard.css" />
  <style>
    .wd-layout{display:grid;grid-template-columns:56px 1fr 280px;min-height:100vh}
    .wd-palette{background:linear-gradient(180deg,rgba(15,23,42,.96),rgba(11,18,34,.98));
                border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;
                padding:14px 0;gap:8px}
    .wd-palette-label{font-size:10px;text-transform:uppercase;color:var(--muted-2);
                      letter-spacing:.1em;margin-bottom:4px}
    .wd-pal-btn{width:40px;height:40px;border-radius:10px;border:1px solid var(--border);
                background:rgba(255,255,255,.04);color:var(--text);cursor:pointer;
                display:grid;place-items:center;font-size:16px;transition:all .15s ease;
                position:relative}
    .wd-pal-btn:hover{border-color:var(--accent);background:rgba(34,197,94,.1);transform:scale(1.05)}
    .wd-pal-btn .tip{position:absolute;left:52px;background:var(--panel);border:1px solid var(--border);
                     padding:4px 8px;border-radius:6px;font-size:11px;white-space:nowrap;
                     opacity:0;pointer-events:none;transition:opacity .15s;z-index:100}
    .wd-pal-btn:hover .tip{opacity:1}
    .wd-toolbar{background:linear-gradient(180deg,rgba(15,23,42,.92),rgba(11,18,34,.96));
                border-bottom:1px solid var(--border);padding:10px 16px;display:flex;
                align-items:center;gap:10px;flex-wrap:wrap}
    .wd-toolbar-title{font-size:15px;font-weight:600;margin-right:auto}
    .wd-canvas-wrap{position:relative;overflow:hidden;background:
      radial-gradient(ellipse at 50% 50%, rgba(14,165,233,.04) 0%, transparent 70%),
      linear-gradient(rgba(148,163,184,.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(148,163,184,.04) 1px, transparent 1px);
      background-size:100% 100%, 20px 20px, 20px 20px;
      background-color:var(--bg)}
    #wd-canvas{width:100%;height:100%;display:block;cursor:default}
    .wd-sidebar{background:linear-gradient(180deg,rgba(15,23,42,.96),rgba(11,18,34,.98));
                border-left:1px solid var(--border);padding:14px;overflow-y:auto}
    .wd-sidebar h3{font-size:13px;font-weight:600;margin:0 0 12px;color:var(--muted)}
    .wd-form-group{margin-bottom:10px}
    .wd-form-group label{display:block;font-size:11px;color:var(--muted-2);
                        text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
    .wd-form-group input,.wd-form-group select,.wd-form-group textarea{
      width:100%;background:rgba(2,6,23,.55);color:var(--text);
      border:1px solid var(--border);border-radius:8px;padding:6px 10px;
      font-size:13px;font-family:Inter,system-ui,sans-serif}
    .wd-form-group textarea{resize:vertical;min-height:60px;font-family:'Fira Code',monospace;font-size:12px}
    .wd-form-group input:focus,.wd-form-group select:focus,.wd-form-group textarea:focus{
      outline:none;border-color:rgba(56,189,248,.45);
      box-shadow:0 0 0 3px rgba(56,189,248,.12)}
    .wd-prop-row{display:flex;align-items:center;gap:6px;margin-bottom:6px}
    .wd-prop-row input{flex:1}
    .wd-prop-remove{width:26px;height:26px;border-radius:6px;border:1px solid var(--border);
                    background:rgba(239,68,68,.1);color:var(--danger);cursor:pointer;
                    font-size:14px;display:grid;place-items:center;flex-shrink:0}
    .wd-prop-remove:hover{border-color:var(--danger)}
    .wd-empty{display:grid;place-items:center;height:100%;color:var(--muted);
              font-size:14px;text-align:center;padding:20px}
    .wd-empty-icon{font-size:48px;opacity:.3;margin-bottom:12px}
    .wd-preview{background:rgba(2,6,23,.4);border:1px solid var(--border);
                border-radius:10px;padding:10px;margin-top:12px;font-size:12px;
                font-family:'Fira Code',monospace;max-height:300px;overflow-y:auto;
                white-space:pre-wrap;color:var(--muted)}
    .wd-preview-header{display:flex;align-items:center;justify-content:space-between;
                       margin-bottom:8px}
    .wd-node-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;
                   border-radius:999px;font-size:10px;font-weight:600}
    .wd-badge-start{background:rgba(56,189,248,.15);color:var(--accent-2);
                     border:1px solid rgba(56,189,248,.3)}
    .wd-badge-step{background:rgba(34,197,94,.12);color:var(--accent);
                    border:1px solid rgba(34,197,94,.25)}
    .wd-badge-end{background:rgba(239,68,68,.12);color:var(--danger);
                   border:1px solid rgba(239,68,68,.25)}
    .wd-badge-condition{background:rgba(245,158,11,.12);color:var(--warn);
                         border:1px solid rgba(245,158,11,.25)}
    .wd-badge-loop{background:rgba(168,85,247,.12);color:#A855F7;
                    border:1px solid rgba(168,85,247,.25)}
    .wd-list{margin-top:12px}
    .wd-list-item{display:flex;align-items:center;gap:8px;padding:6px 8px;
                  border-radius:8px;border:1px solid var(--border);margin-bottom:6px;
                  cursor:pointer;font-size:12px;transition:all .15s}
    .wd-list-item:hover{border-color:var(--border-strong)}
    .wd-list-item.selected{border-color:var(--accent);background:rgba(34,197,94,.08)}
    .wd-list-item .icon{font-size:14px}
    .wd-toast{position:fixed;bottom:24px;right:24px;background:var(--panel);
              border:1px solid var(--border);border-radius:12px;padding:12px 18px;
              font-size:13px;color:var(--text);box-shadow:var(--shadow);
              transform:translateY(80px);opacity:0;transition:all .25s ease;z-index:999}
    .wd-toast.show{transform:translateY(0);opacity:1}
    .wd-toast.success{border-color:rgba(34,197,94,.4)}
    .wd-toast.error{border-color:rgba(239,68,68,.4)}
    .wd-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;
                      display:none;place-items:center}
    .wd-modal-overlay.open{display:grid}
    .wd-modal{background:var(--panel);border:1px solid var(--border);border-radius:16px;
              padding:24px;width:90%;max-width:600px;max-height:80vh;overflow:auto}
    .wd-modal h3{margin:0 0 16px;font-size:16px}
    .wd-modal pre{background:rgba(2,6,23,.5);border:1px solid var(--border);
                  border-radius:10px;padding:12px;font-size:12px;
                  font-family:'Fira Code',monospace;overflow:auto;max-height:400px;
                  white-space:pre-wrap;color:var(--muted)}
    .wd-modal-actions{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
    @media(max-width:900px){.wd-layout{grid-template-columns:1fr}.wd-palette{display:none}
                             .wd-sidebar{border-left:none;border-top:1px solid var(--border)}}
  </style>
</head>
<body>
<div class="layout">
  <nav class="sidebar" aria-label="Primary">
    <div class="brand">
      <div class="brand-mark">◈</div>
      <div class="brand-text"><strong>FreeAI</strong><span>Designer</span></div>
    </div>
    <div class="nav-section">
      <span class="nav-label">Navigation</span>
      <a href="/" class="nav-item"><span class="nav-dot"></span> Dashboard</a>
      <a href="/workflows" class="nav-item"><span class="nav-dot"></span> Workflows</a>
      <a href="/scheduler" class="nav-item"><span class="nav-dot"></span> Scheduler</a>
      <a href="/skills" class="nav-item"><span class="nav-dot"></span> Skills</a>
      <a href="/providers" class="nav-item"><span class="nav-dot"></span> Providers</a>
    </div>
    <div class="sidebar-foot">
      <span class="live-dot" aria-hidden="true"></span>
      <span class="muted">Live</span>
      <span id="node-count" class="muted" style="margin-left:auto">0 nodes</span>
    </div>
  </nav>
</div>

<div class="wd-layout" style="grid-template-columns:56px 1fr 280px">
  <div class="wd-palette">
    <div class="wd-palette-label">Nodes</div>
    <button class="wd-pal-btn" data-type="start" title="Start Node">
      ▶<span class="tip">Start</span>
    </button>
    <button class="wd-pal-btn" data-type="step" title="Step Node">
      ⚙<span class="tip">Step</span>
    </button>
    <button class="wd-pal-btn" data-type="condition" title="Condition Node">
      ◆<span class="tip">Condition</span>
    </button>
    <button class="wd-pal-btn" data-type="loop" title="Loop Node">
      ↻<span class="tip">Loop</span>
    </button>
    <button class="wd-pal-btn" data-type="end" title="End Node">
      ⏹<span class="tip">End</span>
    </button>
    <div style="flex:1"></div>
    <button class="wd-pal-btn" id="btn-clear" title="Clear Canvas" style="color:var(--danger)">
      ✕<span class="tip">Clear</span>
    </button>
  </div>

  <div class="wd-canvas-wrap" id="canvas-wrap">
    <div class="wd-toolbar">
      <span class="wd-toolbar-title">Workflow Designer</span>
      <input type="text" id="wf-name" placeholder="Workflow name…"
             style="width:160px;background:rgba(2,6,23,.55);color:var(--text);
                    border:1px solid var(--border);border-radius:8px;padding:5px 10px;
                    font-size:13px" />
      <button id="btn-export">Export JSON</button>
      <button id="btn-import">Import JSON</button>
      <button id="btn-preview">Preview</button>
      <button id="btn-save" style="border-color:rgba(34,197,94,.4)">Save</button>
      <button id="btn-load" style="border-color:rgba(56,189,248,.4)">Load</button>
    </div>
    <canvas id="wd-canvas"></canvas>
    <input type="file" id="import-input" accept=".json" style="display:none" />
  </div>

  <div class="wd-sidebar" id="sidebar">
    <div class="wd-empty" id="sidebar-empty">
      <div>
        <div class="wd-empty-icon">◈</div>
        <p>Click a node on the canvas<br>to edit its properties</p>
      </div>
    </div>
    <div id="sidebar-content" style="display:none">
      <h3>Node Properties</h3>
      <div class="wd-form-group">
        <label>Type</label>
        <input id="prop-type" readonly style="color:var(--muted)" />
      </div>
      <div class="wd-form-group">
        <label>Name</label>
        <input id="prop-name" />
      </div>
      <div class="wd-form-group" id="grp-agent">
        <label>Agent</label>
        <select id="prop-agent">
          <option value="orchestrate">orchestrate</option>
          <option value="project">project</option>
          <option value="refactor">refactor</option>
          <option value="analyze">analyze</option>
          <option value="codegen">codegen</option>
          <option value="test">test</option>
          <option value="security">security</option>
          <option value="review">review</option>
        </select>
      </div>
      <div class="wd-form-group" id="grp-condition">
        <label>Condition Expression</label>
        <input id="prop-condition" placeholder="e.g. result.success" />
      </div>
      <div class="wd-form-group" id="grp-loop">
        <label>Loop Max Iterations</label>
        <input id="prop-loop-iterations" type="number" value="10" min="1" max="1000" />
      </div>
      <div class="wd-form-group">
        <label>Consumes (comma-separated)</label>
        <input id="prop-consumes" placeholder="step1, step2" />
      </div>
      <div class="wd-form-group">
        <label>Produces</label>
        <input id="prop-produces" placeholder="output" />
      </div>
      <div class="wd-form-group" id="grp-payload">
        <label>Payload (JSON)</label>
        <textarea id="prop-payload" rows="4"></textarea>
      </div>
      <div class="wd-form-group">
        <label>Config (JSON)</label>
        <textarea id="prop-config" rows="3"></textarea>
      </div>
      <div class="wd-prop-row" style="margin-top:8px">
        <button id="btn-delete-node" style="background:rgba(239,68,68,.15);border-color:rgba(239,68,68,.3);color:var(--danger);flex:1">Delete Node</button>
      </div>
      <div class="wd-list" id="connections-list"></div>
    </div>
    <div id="sidebar-preview" style="display:none">
      <div class="wd-preview-header">
        <h3>Live Preview</h3>
        <button id="btn-close-preview" style="font-size:11px;padding:3px 8px">✕</button>
      </div>
      <pre class="wd-preview" id="preview-output"></pre>
    </div>
  </div>
</div>

<div class="wd-toast" id="toast"></div>
<div class="wd-modal-overlay" id="preview-modal">
  <div class="wd-modal">
    <h3>Workflow Preview</h3>
    <pre id="preview-modal-content"></pre>
    <div class="wd-modal-actions">
      <button id="btn-close-preview-modal">Close</button>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";

const CANVAS_W = 1200, CANVAS_H = 800;
const NODE_W = 150, NODE_H = 56;
const COLORS = {
  start:   { fill: "rgba(56,189,248,.12)", stroke: "#38BDF8", text: "#38BDF8" },
  step:    { fill: "rgba(34,197,94,.10)",  stroke: "#22C55E", text: "#22C55E"  },
  end:     { fill: "rgba(239,68,68,.10)",  stroke: "#EF4444", text: "#EF4444"  },
  condition:{ fill:"rgba(245,158,11,.10)", stroke: "#F59E0B", text: "#F59E0B" },
  loop:    { fill: "rgba(168,85,247,.10)", stroke: "#A855F7", text: "#A855F7" },
};
const TYPE_ICONS = { start:"▶", step:"⚙", end:"⏹", condition:"◆", loop:"↻" };

let nodes = [];
let edges = [];
let selectedId = null;
let dragging = null;
let dragOffset = {x:0,y:0};
let connecting = null;
let pan = {x:0,y:0};
let zoom = 1;
let isPanning = false;
let panStart = {x:0,y:0};
let nextId = 1;

const canvas = document.getElementById("wd-canvas");
const ctx = canvas.getContext("2d");
const wrap = document.getElementById("canvas-wrap");

function resize(){
  canvas.width = wrap.clientWidth;
  canvas.height = wrap.clientHeight;
  draw();
}
window.addEventListener("resize", resize);

function screenToCanvas(sx, sy){
  return {
    x: (sx - pan.x) / zoom,
    y: (sy - pan.y) / zoom
  };
}
function canvasToScreen(cx, cy){
  return {
    x: cx * zoom + pan.x,
    y: cy * zoom + pan.y
  };
}

function getNodeAt(cx, cy){
  for(let i = nodes.length-1; i >= 0; i--){
    const n = nodes[i];
    if(cx >= n.x && cx <= n.x+NODE_W && cy >= n.y && cy <= n.y+NODE_H){
      return n;
    }
  }
  return null;
}

function getPort(node, side){
  const s = canvasToScreen(node.x, node.y);
  const w = NODE_W * zoom, h = NODE_H * zoom;
  const px = s.x, py = s.y;
  switch(side){
    case "left": return {x: px, y: py + h/2};
    case "right": return {x: px + w, y: py + h/2};
    case "top": return {x: px + w/2, y: py};
    case "bottom": return {x: px + w/2, y: py + h};
  }
}

function portAt(sx, sy){
  for(const n of nodes){
    const s = canvasToScreen(n.x, n.y);
    const w = NODE_W*zoom, h = NODE_H*zoom;
    const px=s.x, py=s.y;
    const THRESH = 12;
    if(Math.abs(sx-(px+w))<THRESH && Math.abs(sy-(py+h/2))<THRESH) return {node:n,side:"right"};
    if(Math.abs(sx-px)<THRESH && Math.abs(sy-(py+h/2))<THRESH) return {node:n,side:"left"};
  }
  return null;
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.save();
  ctx.translate(pan.x, pan.y);
  ctx.scale(zoom, zoom);

  drawEdges();
  drawNodes();

  ctx.restore();

  if(connecting){
    ctx.save();
    ctx.strokeStyle = "rgba(56,189,248,.6)";
    ctx.lineWidth = 2;
    ctx.setLineDash([6,4]);
    const sp = canvasToScreen(connecting.fromX, connecting.fromY);
    ctx.beginPath();
    ctx.moveTo(sp.x, sp.y);
    ctx.lineTo(connecting.mx, connecting.my);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }
}

function drawNodes(){
  for(const n of nodes){
    const c = COLORS[n.type] || COLORS.step;
    const isSelected = n.id === selectedId;
    const s = canvasToScreen(n.x, n.y);
    const w = NODE_W*zoom, h = NODE_H*zoom;

    ctx.fillStyle = c.fill;
    ctx.strokeStyle = isSelected ? "#22C55E" : c.stroke;
    ctx.lineWidth = isSelected ? 2 : 1;
    const r = 10*zoom;
    roundRect(ctx, s.x, s.y, w, h, r);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = c.text;
    ctx.font = `bold ${13*zoom}px Inter, system-ui`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    const label = n.name || n.type;
    ctx.fillText(label.length > 12 ? label.slice(0,11)+"…" : label, s.x + w/2, s.y + h/2);

    if(isSelected){
      drawPorts(n);
    }
  }
}

function drawPorts(node){
  const sides = ["left","right"];
  for(const side of sides){
    const p = getPort(node, side);
    ctx.fillStyle = "#38BDF8";
    ctx.beginPath();
    ctx.arc(p.x, p.y, 5, 0, Math.PI*2);
    ctx.fill();
  }
}

function drawEdges(){
  for(const e of edges){
    const fromNode = nodes.find(n=>n.id===e.from);
    const toNode = nodes.find(n=>n.id===e.to);
    if(!fromNode || !toNode) continue;

    const from = getPort(fromNode, "right");
    const to = getPort(toNode, "left");

    const mx = (from.x + to.x) / 2;
    const cp1x = mx, cp1y = from.y;
    const cp2x = mx, cp2y = to.y;

    ctx.strokeStyle = "rgba(148,163,184,.4)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(from.x, from.y);
    ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, to.x, to.y);
    ctx.stroke();

    const dot = (t)=>{
      const t1=1-t;
      return {
        x: t1*t1*t1*from.x + 3*t1*t1*t*mx + 3*t1*t*t*mx + t*t*t*to.x,
        y: t1*t1*t1*from.y + 3*t1*t1*t*from.y + 3*t1*t*t*to.y + t*t*t*to.y
      };
    };
    const tt = ((Date.now()%2000)/2000);
    const p = dot(tt);
    ctx.fillStyle = "rgba(56,189,248,.8)";
    ctx.beginPath();
    ctx.arc(p.x, p.y, 3, 0, Math.PI*2);
    ctx.fill();

    ctx.fillStyle = "rgba(148,163,184,.7)";
    ctx.font = `${11*zoom}px Inter`;
    ctx.textAlign = "center";
    ctx.textBaseline = "bottom";
    ctx.fillText("→", mx, Math.min(from.y, to.y)-4);
  }
}

function roundRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y);
  ctx.quadraticCurveTo(x+w, y, x+w, y+r);
  ctx.lineTo(x+w, y+h-r);
  ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  ctx.lineTo(x+r, y+h);
  ctx.quadraticCurveTo(x, y+h, x, y+h-r);
  ctx.lineTo(x, y+r);
  ctx.quadraticCurveTo(x, y, x+r, y);
  ctx.closePath();
}

function addNode(type, x, y){
  const id = String(nextId++);
  const names = {start:"Start", step:"Step", end:"End", condition:"Condition", loop:"Loop"};
  const node = {
    id, type,
    name: names[type] || type,
    agent: "orchestrate",
    consumes: [],
    produces: [],
    condition: "",
    loopIterations: 10,
    payload: {},
    config: {},
    x: Math.max(0, Math.min(x - NODE_W/2, CANVAS_W - NODE_W)),
    y: Math.max(0, Math.min(y - NODE_H/2, CANVAS_H - NODE_H)),
  };
  nodes.push(node);
  draw();
  updateNodeCount();
  return node;
}

function updateNodeCount(){
  document.getElementById("node-count").textContent = nodes.length + " node" + (nodes.length!==1?"s":"");
}

function selectNode(id){
  selectedId = id;
  draw();
  renderSidebar();
}

function renderSidebar(){
  const empty = document.getElementById("sidebar-empty");
  const content = document.getElementById("sidebar-content");
  const preview = document.getElementById("sidebar-preview");
  preview.style.display = "none";
  if(!selectedId){
    empty.style.display = "grid";
    content.style.display = "none";
    return;
  }
  const n = nodes.find(x=>x.id===selectedId);
  if(!n){ empty.style.display="grid"; content.style.display="none"; return; }
  empty.style.display = "none";
  content.style.display = "block";
  document.getElementById("prop-type").value = n.type;
  document.getElementById("prop-name").value = n.name;
  document.getElementById("prop-agent").value = n.agent;
  document.getElementById("prop-condition").value = n.condition || "";
  document.getElementById("prop-loop-iterations").value = n.loopIterations || 10;
  document.getElementById("prop-consumes").value = n.consumes.join(", ");
  document.getElementById("prop-produces").value = n.produces.join(", ");
  document.getElementById("prop-payload").value = JSON.stringify(n.payload || {}, null, 2);
  document.getElementById("prop-config").value = JSON.stringify(n.config || {}, null, 2);

  const showAgent = n.type !== "start" && n.type !== "end";
  document.getElementById("grp-agent").style.display = showAgent ? "" : "none";
  document.getElementById("grp-condition").style.display = n.type==="condition" ? "" : "none";
  document.getElementById("grp-loop").style.display = n.type==="loop" ? "" : "none";
  document.getElementById("grp-payload").style.display = (n.type!=="start"&&n.type!=="end") ? "" : "none";

  renderConnectionsList(n);
}

function renderConnectionsList(node){
  const list = document.getElementById("connections-list");
  const incoming = edges.filter(e=>e.to===node.id).map(e=>{
    const s = nodes.find(n=>n.id===e.from);
    return s ? `← ${s.name}` : "";
  }).filter(Boolean);
  const outgoing = edges.filter(e=>e.from===node.id).map(e=>{
    const s = nodes.find(n=>n.id===e.to);
    return s ? `${s.name} →` : "";
  }).filter(Boolean);
  const items = [...incoming,...outgoing];
  if(!items.length){
    list.innerHTML = '<div style="font-size:11px;color:var(--muted-2);margin-top:8px">No connections</div>';
    return;
  }
  list.innerHTML = '<div style="font-size:11px;color:var(--muted-2);margin-top:8px">Connections</div>' +
    items.map(i=>`<div class="wd-list-item"><span style="font-size:11px;color:var(--muted)">${i}</span></div>`).join("");
}

function saveNodeProps(){
  const n = nodes.find(x=>x.id===selectedId);
  if(!n) return;
  n.name = document.getElementById("prop-name").value;
  n.agent = document.getElementById("prop-agent").value;
  n.condition = document.getElementById("prop-condition").value;
  n.loopIterations = parseInt(document.getElementById("prop-loop-iterations").value) || 10;
  n.consumes = document.getElementById("prop-consumes").value.split(",").map(s=>s.trim()).filter(Boolean);
  n.produces = document.getElementById("prop-produces").value.split(",").map(s=>s.trim()).filter(Boolean);
  try { n.payload = JSON.parse(document.getElementById("prop-payload").value) || {}; } catch(e){}
  try { n.config = JSON.parse(document.getElementById("prop-config").value) || {}; } catch(e){}
  draw();
  renderSidebar();
}

canvas.addEventListener("mousedown", e=>{
  const rect = canvas.getBoundingClientRect();
  const cx = screenToCanvas(e.clientX-rect.left, e.clientY-rect.top);

  const portHit = portAt(e.clientX-rect.left, e.clientY-rect.top);
  if(portHit){
    connecting = {fromNode: portHit.node, fromX: portHit.node.x, fromY: portHit.node.y, mx:e.clientX-rect.left, my:e.clientY-rect.top};
    return;
  }

  const node = getNodeAt(cx.x, cx.y);
  if(node){
    selectNode(node.id);
    dragging = node;
    dragOffset = {x: cx.x - node.x, y: cx.y - node.y};
  } else {
    selectNode(null);
    isPanning = true;
    panStart = {x: e.clientX - pan.x, y: e.clientY - pan.y};
  }
});

canvas.addEventListener("mousemove", e=>{
  const rect = canvas.getBoundingClientRect();
  const sx = e.clientX - rect.left, sy = e.clientY - rect.top;

  if(connecting){
    connecting.mx = sx;
    connecting.my = sy;
    draw();
    return;
  }
  if(dragging){
    const cx = screenToCanvas(sx, sy);
    dragging.x = Math.max(0, Math.min(cx.x - dragOffset.x, CANVAS_W - NODE_W));
    dragging.y = Math.max(0, Math.min(cx.y - dragOffset.y, CANVAS_H - NODE_H));
    draw();
    return;
  }
  if(isPanning){
    pan.x = e.clientX - panStart.x;
    pan.y = e.clientY - panStart.y;
    draw();
  }
});

canvas.addEventListener("mouseup", e=>{
  if(connecting){
    const portHit = portAt(e.clientX-canvas.getBoundingClientRect().left, e.clientY-canvas.getBoundingClientRect().top);
    if(portHit && portHit.node.id !== connecting.fromNode.id){
      const exists = edges.some(ed=>ed.from===connecting.fromNode.id && ed.to===portHit.node.id);
      if(!exists){
        edges.push({from:connecting.fromNode.id, to:portHit.node.id});
        renderSidebar();
      }
    }
    connecting = null;
    draw();
    return;
  }
  dragging = null;
  isPanning = false;
});

canvas.addEventListener("dblclick", e=>{
  const rect = canvas.getBoundingClientRect();
  const cx = screenToCanvas(e.clientX-rect.left, e.clientY-rect.top);
  const node = getNodeAt(cx.x, cx.y);
  if(node) selectNode(node.id);
});

canvas.addEventListener("wheel", e=>{
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX-rect.left, my = e.clientY-rect.top;
  const factor = e.deltaY < 0 ? 1.08 : 1/1.08;
  const newZoom = Math.max(0.3, Math.min(3, zoom * factor));
  pan.x = mx - (mx - pan.x) * (newZoom / zoom);
  pan.y = my - (my - pan.y) * (newZoom / zoom);
  zoom = newZoom;
  draw();
}, {passive:false});

document.querySelectorAll(".wd-pal-btn[data-type]").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    const type = btn.dataset.type;
    const rect = canvas.getBoundingClientRect();
    const cx = screenToCanvas(rect.width/2, rect.height/2);
    const n = addNode(type, cx.x, cx.y);
    selectNode(n.id);
    toast("Added " + type + " node", "success");
  });
});

document.getElementById("btn-clear").addEventListener("click", ()=>{
  if(nodes.length && !confirm("Clear all nodes?")) return;
  nodes = []; edges = []; selectedId = null;
  draw(); renderSidebar(); updateNodeCount();
});

["prop-name","prop-agent","prop-condition","prop-loop-iterations",
 "prop-consumes","prop-produces","prop-payload","prop-config"
].forEach(id=>{
  document.getElementById(id).addEventListener("input", saveNodeProps);
});

document.getElementById("btn-delete-node").addEventListener("click", ()=>{
  if(!selectedId) return;
  if(!confirm("Delete this node?")) return;
  nodes = nodes.filter(n=>n.id!==selectedId);
  edges = edges.filter(e=>e.from!==selectedId && e.to!==selectedId);
  selectedId = null;
  draw(); renderSidebar(); updateNodeCount();
  toast("Node deleted", "success");
});

function exportWorkflow(){
  const name = document.getElementById("wf-name").value || "untitled-workflow";
  const steps = nodes.map(n=>({
    name: n.name, type: n.type, agent: n.agent,
    consumes: n.consumes, produces: n.produces,
    condition: n.condition || undefined,
    loopIterations: n.loopIterations || undefined,
    payload: Object.keys(n.payload).length ? n.payload : undefined,
    config: Object.keys(n.config).length ? n.config : undefined,
    x: Math.round(n.x), y: Math.round(n.y),
  })).filter(s => s.name);
  const def = {name, version:"1.0", nodes, edges, steps};
  const json = JSON.stringify(def, null, 2);
  const blob = new Blob([json], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name.replace(/\s+/g,"-").toLowerCase() + ".json";
  a.click();
  URL.revokeObjectURL(a.href);
  toast("Exported " + json.length + " bytes", "success");
  return def;
}

document.getElementById("btn-export").addEventListener("click", exportWorkflow);

document.getElementById("btn-import").addEventListener("click", ()=>{
  document.getElementById("import-input").click();
});
document.getElementById("import-input").addEventListener("change", e=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ev=>{
    try{
      const def = JSON.parse(ev.target.result);
      nodes = def.nodes || [];
      edges = def.edges || [];
      selectedId = null;
      if(def.name) document.getElementById("wf-name").value = def.name;
      draw(); renderSidebar(); updateNodeCount();
      toast("Imported " + (nodes.length||0) + " nodes", "success");
    }catch(err){
      toast("Invalid JSON: " + err.message, "error");
    }
  };
  reader.readAsText(file);
  e.target.value = "";
});

document.getElementById("btn-preview").addEventListener("click", ()=>{
  const def = exportWorkflow();
  const modal = document.getElementById("preview-modal");
  document.getElementById("preview-modal-content").textContent = JSON.stringify(def, null, 2);
  modal.classList.add("open");
  document.getElementById("sidebar-preview").style.display = "none";
  document.getElementById("sidebar-content").style.display = "block";
});
document.getElementById("btn-close-preview-modal").addEventListener("click", ()=>{
  document.getElementById("preview-modal").classList.remove("open");
});
document.getElementById("preview-modal").addEventListener("click", e=>{
  if(e.target===e.currentTarget) e.currentTarget.classList.remove("open");
});

document.getElementById("btn-save").addEventListener("click", async()=>{
  const def = exportWorkflow();
  try{
    const res = await fetch("/api/workflow/save", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({name:def.name, definition:def})
    });
    const json = await res.json();
    if(json.ok) toast("Saved to /workflows (" + (def.name||"untitled") + ")", "success");
    else toast("Save failed: " + (json.error||"unknown"), "error");
  }catch(err){
    toast("Save failed: " + err.message, "error");
  }
});

document.getElementById("btn-load").addEventListener("click", async()=>{
  try{
    const res = await fetch("/api/workflows");
    const json = await res.json();
    const list = json.workflows || [];
    if(!list.length){ toast("No saved workflows found", "error"); return; }
    const names = list.map(w=>w.name||w.id).join("\n");
    const chosen = prompt("Enter workflow name to load:\n\n" + names, list[0].name||list[0].id);
    if(!chosen) return;
    const wf = list.find(w=>(w.name||w.id)===chosen);
    if(!wf) { toast("Workflow not found: "+chosen, "error"); return; }
    const def = wf.definition || wf;
    nodes = def.nodes || def.steps?.map((s,i)=>({
      id:String(i+1), type:s.type||"step", name:s.name,
      agent:s.agent||"orchestrate", consumes:s.consumes||[], produces:s.produces||[],
      x:i*170, y:100, payload:s.payload||{}, config:s.config||{},
      condition:s.condition||"", loopIterations:s.loopIterations||10,
    })) || [];
    edges = def.edges || [];
    selectedId = null;
    if(def.name) document.getElementById("wf-name").value = def.name;
    draw(); renderSidebar(); updateNodeCount();
    toast("Loaded: " + chosen, "success");
  }catch(err){
    toast("Load failed: " + err.message, "error");
  }
});

function toast(msg, type="success"){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "wd-toast show " + type;
  setTimeout(()=>t.classList.remove("show"), 3000);
}
