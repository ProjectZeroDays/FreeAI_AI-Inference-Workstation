apiVersion: apps/v1
kind: Deployment
metadata:
  name: agents
  namespace: freeai-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agents
  template:
    metadata:
      labels:
        app: agents
    spec:
      containers:
        - name: agents
          image: your-registry/agents:latest
          ports:
            - containerPort: 8120
          env:
            - name: ROUTER_URL
              value: http://router:8010/route
---
apiVersion: v1
kind: Service
metadata:
  name: agents
  namespace: freeai-stack
spec:
  selector:
    app: agents
  ports:
    - port: 8120
      targetPort: 8120
