apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: freeai-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      nodeSelector:
        nvidia.com/gpu.present: "true"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: vllm
          image: vllm/vllm-openai:latest
          args: ["--host", "0.0.0.0", "--port", "9002",
                 "--model", "Qwen/Qwen2.5-7B-Instruct",
                 "--enable-prefix-caching"]
          ports:
            - containerPort: 9002
          env:
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
          resources:
            limits:
              nvidia.com/gpu: 1
---
apiVersion: v1
kind: Service
metadata:
  name: vllm
  namespace: freeai-stack
spec:
  selector:
    app: vllm
  ports:
    - port: 9002
      targetPort: 9002
