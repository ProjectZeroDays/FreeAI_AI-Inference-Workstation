apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: freeai-models
  namespace: freeai-stack
  labels:
    app: freeai
    tier: storage
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
  # storageClassName: fast-ssd  # set to your cluster's GPU-adjacent class
---
