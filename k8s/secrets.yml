# FreeAI K8s Secrets
#
# Deploy with:
#   kubectl apply -f k8s/secrets.yml -n freeai-stack
#
# For sealed secrets, use:
#   kubeseal --scope namespace-wide < k8s/secrets.yml | kubectl apply -f -

apiVersion: v1
kind: Secret
metadata:
  name: freeai-secrets
  namespace: freeai-stack
  labels:
    app: freeai
    managed-by: helm
  annotations:
    sealed-secrets.bitnami.com/sealed-secret: "false"
    description: "FreeAI inference workstation secrets"
type: Opaque
stringData:
  # Database password (PostgreSQL / SQLite)
  db-password: "CHANGE-ME-POSTGRES-PASSWORD"

  # API keys for AI providers
  openai-api-key: "sk-change-me-openai"
  anthropic-api-key: "sk-ant-change-me-anthropic"
  hf-token: "hf_change_me_huggingface"

  # JWT signing key (32+ bytes recommended)
  jwt-signing-key: "change-me-jwt-signing-key-at-least-32-chars"

  # Dashboard auth token
  dashboard-auth-token: "change-me-dashboard-token"

  # Router and agent API keys
  router-api-key: "change-me-router-api-key"
  agent-api-key: "change-me-agent-api-key"

  # Auto-auth hash (Caddy-style)
  autoauth-hash: "change-me-caddy-hash"

---
# TLS certificate placeholder
# Generate real certs before deploying:
#   openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
#     -keyout freeai-tls.key -out freeai-tls.crt \
#     -subj "/CN=freeai.local"
apiVersion: v1
kind: Secret
metadata:
  name: freeai-tls
  namespace: freeai-stack
  labels:
    app: freeai
type: kubernetes.io/tls
stringData:
  tls.crt: "PLACEHOLDER-DO-NOT-USE-IN-PRODUCTION"
  tls.key: "PLACEHOLDER-DO-NOT-USE-IN-PRODUCTION"

