apiVersion: v1
kind: Service
metadata:
  name: router
  namespace: freeai-stack
  labels:
    app: router
    tier: backend
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8010"
spec:
  type: ClusterIP
  selector:
    app: router
  ports:
    - name: http
      port: 8010
      targetPort: 8010
      protocol: TCP
    - name: ws
      port: 8011
      targetPort: 8011
      protocol: TCP
---
