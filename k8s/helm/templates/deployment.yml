{{- define "freeai.commonLabels" }}
app: {{ .name }}
tier: {{ .tier | default "backend" }}
{{- if .gpu }}
gpu: "true"
{{- end }}
{{- end }}

{{- define "freeai.image" }}
{{- $registry := .Values.global.imageRegistry }}
{{- $img := .image }}
{{- printf "%s/%s:%s" $registry $img.repository $img.tag }}
{{- end }}

{{- define "freeai.probe" }}
{{- $path := .path | default "/health" }}
{{- $port := .port }}
{{- $initDelay := .initialDelaySeconds | default 15 }}
{{- $period := .periodSeconds | default 15 }}
{{- $timeout := .timeoutSeconds | default 5 }}
{{- $fail := .failureThreshold | default 5 }}
{{- $probeType := .probeType | default "http" }}
livenessProbe:
  {{- if eq $probeType "tcp" }}
  tcpSocket:
    port: {{ $port }}
  {{- else }}
  httpGet:
    path: {{ $path }}
    port: {{ $port }}
  {{- end }}
  initialDelaySeconds: {{ $initDelay }}
  periodSeconds: {{ $period }}
  timeoutSeconds: {{ $timeout }}
  failureThreshold: {{ $fail }}
readinessProbe:
  {{- if eq $probeType "tcp" }}
  tcpSocket:
    port: {{ $port }}
  {{- else }}
  httpGet:
    path: {{ $path }}
    port: {{ $port }}
  {{- end }}
  initialDelaySeconds: {{ $initDelay | mul 2 | div }}
  periodSeconds: {{ $period }}
  timeoutSeconds: {{ $timeout }}
  failureThreshold: {{ $fail | sub 2 }}
{{- end }}

---
# router
apiVersion: apps/v1
kind: Deployment
metadata:
  name: router
  namespace: {{ .Values.global.namespace }}
  labels:
    app: router
    tier: backend
    {{- toYaml .Values.global.commonLabels | nindent 4 }}
spec:
  {{- if not .Values.hpa.router.enabled }}
  replicas: {{ .Values.deployments.router.replicas }}
  {{- end }}
  selector:
    matchLabels:
      app: router
  strategy:
    type: {{ .Values.deployments.router.strategy }}
    {{- if eq .Values.deployments.router.strategy "RollingUpdate" }}
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    {{- end }}
  template:
    metadata:
      labels:
        app: router
        tier: backend
        {{- if .Values.prometheus.scrape }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.config.routerPort }}"
        {{- end }}
      annotations:
        {{- if .Values.prometheus.scrape }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.config.routerPort }}"
        {{- end }}
    spec:
      containers:
        - name: router
          image: {{ include "freeai.image" (merge (dict "image" .Values.images.router) (dict "name" "router" "tier" "backend")) }}
          imagePullPolicy: {{ .Values.images.router.pullPolicy }}
          ports:
            - name: http
              containerPort: 8010
              protocol: TCP
            - name: ws
              containerPort: 8011
              protocol: TCP
          envFrom:
            - configMapRef:
                name: freeai-config
          env:
            - name: LLAMA_BASE
              value: "http://llama:9001"
            - name: ROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: freeai-secrets
                  key: router-api-key
          resources:
            {{- toYaml .Values.deployments.router.resources | nindent 12 }}
          {{- include "freeai.probe" (merge (dict "port" 8010 "initialDelaySeconds" 15 "periodSeconds" 15) (dict "name" "router")) | nindent 10 }}
