---
# llama (GPU)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama
  namespace: {{ .Values.global.namespace }}
  labels:
    app: llama
    tier: inference
    gpu: "true"
    {{- toYaml .Values.global.commonLabels | nindent 4 }}
spec:
  replicas: {{ .Values.deployments.llama.replicas }}
  selector:
    matchLabels:
      app: llama
  strategy:
    type: {{ .Values.deployments.llama.strategy }}
  template:
    metadata:
      labels:
        app: llama
        tier: inference
        gpu: "true"
        {{- if .Values.prometheus.scrape }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.config.llamaPort }}"
        {{- end }}
    spec:
      nodeSelector:
        {{- toYaml .Values.deployments.llama.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.deployments.llama.tolerations | nindent 8 }}
      affinity:
        {{- toYaml .Values.deployments.llama.affinity | nindent 8 }}
      containers:
        - name: llama
          image: {{ include "freeai.image" (merge (dict "image" .Values.images.llama) (dict "name" "llama" "tier" "inference")) }}
          imagePullPolicy: {{ .Values.images.llama.pullPolicy }}
          args: []
          ports:
            - containerPort: 9001
              protocol: TCP
          envFrom:
            - configMapRef:
                name: freeai-config
          env:
            - name: LLAMA_PORT
              value: {{ .Values.config.llamaPort | quote }}
            - name: LLAMA_MODEL_PATH
              value: {{ .Values.config.llamaModelPath | quote }}
            - name: N_GPU_LAYERS
              value: {{ .Values.config.nGpuLayers | quote }}
            - name: LLAMA_VISION_ENABLED
              value: {{ .Values.config.llamaVisionEnabled | default "false" | quote }}
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: compute,utility
          resources:
            {{- toYaml .Values.deployments.llama.resources | nindent 12 }}
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
          {{- include "freeai.probe" (merge (dict "port" 9001 "initialDelaySeconds" 60 "periodSeconds" 30 "timeoutSeconds" 10) (dict "name" "llama")) | nindent 10 }}
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: freeai-models
---
# vllm (GPU)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: {{ .Values.global.namespace }}
  labels:
    app: vllm
    tier: inference
    gpu: "true"
    {{- toYaml .Values.global.commonLabels | nindent 4 }}
spec:
  replicas: {{ .Values.deployments.vllm.replicas }}
  selector:
    matchLabels:
      app: vllm
  strategy:
    type: {{ .Values.deployments.vllm.strategy }}
  template:
    metadata:
      labels:
        app: vllm
        tier: inference
        gpu: "true"
        {{- if .Values.prometheus.scrape }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.config.vllmPort }}"
        {{- end }}
    spec:
      nodeSelector:
        {{- toYaml .Values.deployments.vllm.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.deployments.vllm.tolerations | nindent 8 }}
      affinity:
        {{- toYaml .Values.deployments.vllm.affinity | nindent 8 }}
      containers:
        - name: vllm
          image: {{ include "freeai.image" (merge (dict "image" .Values.images.vllm) (dict "name" "vllm" "tier" "inference")) }}
          imagePullPolicy: {{ .Values.images.vllm.pullPolicy }}
          args:
            - "--host"
            - "0.0.0.0"
            - "--port"
            - {{ .Values.config.vllmPort | quote }}
            - "--model"
            - {{ .Values.config.vllmModel | quote }}
            - "--enable-prefix-caching"
          ports:
            - containerPort: 9002
              protocol: TCP
          env:
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: compute,utility
          resources:
            {{- toYaml .Values.deployments.vllm.resources | nindent 12 }}
          {{- include "freeai.probe" (merge (dict "port" 9002 "initialDelaySeconds" 60 "periodSeconds" 30 "timeoutSeconds" 10 "probeType" "tcp") (dict "name" "vllm")) | nindent 10 }}
