apiVersion: v1
kind: Secret
metadata:
  name: freeai-secrets
  namespace: {{ .Values.global.namespace }}
  labels:
    app: freeai
type: Opaque
stringData:
  {{- with .Values.secrets.routerApiKey }}
  router-api-key: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.agentApiKey }}
  agent-api-key: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.dashboardAuthToken }}
  dashboard-auth-token: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.autoauthHash }}
  autoauth-hash: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.openaiApiKey }}
  openai-api-key: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.anthropicApiKey }}
  anthropic-api-key: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.hfToken }}
  hf-token: {{ . | quote }}
  {{- end }}
