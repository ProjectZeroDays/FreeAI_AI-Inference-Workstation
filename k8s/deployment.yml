apiVersion: apps/v1
kind: Deployment
metadata:
  name: router
  namespace: freeai-stack
  labels:
    app: router
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: router
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: router
        tier: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8010"
    spec:
      containers:
        - name: router
          image: your-registry/router:latest
          ports:
            - name: http
              containerPort: 8010
              protocol: TCP
            - name: ws
              containerPort: 8011
              protocol: TCP
          envFrom:
            - configMapRef:
                name: freeai-config
          env:
            - name: LLAMA_BASE
              value: "http://llama:9001"
            - name: ROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: freeai-secrets
                  key: router-api-key
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "2000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8010
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8010
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
---
