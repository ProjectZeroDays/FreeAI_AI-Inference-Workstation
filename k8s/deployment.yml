apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama
  namespace: freeai-stack
  labels:
    app: llama
    tier: inference
    gpu: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llama
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: llama
        tier: inference
        gpu: "true"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9001"
    spec:
      nodeSelector:
        nvidia.com/gpu.present: "true"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: llama
          image: your-registry/llama:latest
          ports:
            - containerPort: 9001
              protocol: TCP
          envFrom:
            - configMapRef:
                name: freeai-config
          env:
            - name: LLAMA_PORT
              value: "9001"
            - name: LLAMA_MODEL_PATH
              value: /models/Qwen3.6-12B-IQ-Ultra-Heretic-Uncensored-Thinking-Q6_K.gguf
            - name: N_GPU_LAYERS
              value: "80"
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: compute,utility
          resources:
            requests:
              cpu: "2000m"
              memory: "8Gi"
              nvidia.com/gpu: 1
            limits:
              cpu: "8000m"
              memory: "16Gi"
              nvidia.com/gpu: 1
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: 9001
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 9001
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: freeai-models
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: freeai-stack
  labels:
    app: vllm
    tier: inference
    gpu: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: vllm
        tier: inference
        gpu: "true"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9002"
    spec:
      nodeSelector:
        nvidia.com/gpu.present: "true"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: vllm
          image: vllm/vllm-openai:latest
          args:
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "9002"
            - "--model"
            - "Qwen/Qwen2.5-7B-Instruct"
            - "--enable-prefix-caching"
          ports:
            - containerPort: 9002
              protocol: TCP
          env:
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: compute,utility
          resources:
            requests:
              cpu: "4000m"
              memory: "16Gi"
              nvidia.com/gpu: 1
            limits:
              cpu: "8000m"
              memory: "32Gi"
              nvidia.com/gpu: 1
          livenessProbe:
            tcpSocket:
              port: 9002
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            tcpSocket:
              port: 9002
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
