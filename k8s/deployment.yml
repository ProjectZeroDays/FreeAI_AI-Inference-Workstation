apiVersion: apps/v1
kind: Deployment
metadata:
  name: workflow
  namespace: freeai-stack
  labels:
    app: workflow
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: workflow
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: workflow
        tier: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8040"
    spec:
      containers:
        - name: workflow
          image: your-registry/workflow:latest
          ports:
            - containerPort: 8040
              protocol: TCP
          envFrom:
            - configMapRef:
                name: freeai-config
          env:
            - name: AGENT_API
              value: "http://agents:8020"
            - name: WORKFLOW_AUDIT_LOG
              value: "/workspace/logs/workflow-audit.jsonl"
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "2000m"
              memory: "1Gi"
          volumeMounts:
            - name: audit-logs
              mountPath: /workspace/logs
          livenessProbe:
            httpGet:
              path: /health
              port: 8040
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8040
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: audit-logs
          persistentVolumeClaim:
            claimName: freeai-audit-logs
---
apiVersion: apps/v1
