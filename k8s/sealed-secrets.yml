# Sealed Secrets Template for FreeAI
#
# Usage:
#   1. Install kubeseal: https://github.com/bitnami-labs/sealed-secrets
#   2. Create the plain secret first:
#      kubectl create secret generic freeai-secrets \
#        --namespace=freeai-stack \
#        --from-literal=router-api-key='<your-key>' \
#        --from-literal=agent-api-key='<your-key>' \
#        --from-literal=dashboard-auth-token='<your-token>' \
#        --dry-run=client -o yaml > secret.yml
#   3. Seal it:
#      kubeseal --scope namespace-wide < secret.yml > k8s/sealed-secrets.yml
#   4. Delete the plain secret:
#      kubectl delete secret freeai-secrets -n freeai-stack
#
# NOTE: This template must be replaced with an actual sealed secret.
#       Do NOT commit plain secrets to version control.

apiVersion: v1
kind: Secret
metadata:
  name: freeai-secrets
  namespace: freeai-stack
  labels:
    app: freeai
type: Opaque
stringData:
  # IMPORTANT: Replace stringData with sealedSecret.data after sealing
  # router-api-key: <generated-with-openssl-rand-hex-32>
  # agent-api-key: <generated-with-openssl-rand-hex-32>
  # dashboard-auth-token: <your-dashboard-token>
  # autoauth-hash: <caddy-hash-password-result>
  router-api-key: "REPLACE-WITH-SEALED-SECRET"
  agent-api-key: "REPLACE-WITH-SEALED-SECRET"
  dashboard-auth-token: "REPLACE-WITH-SEALED-SECRET"
  autoauth-hash: "REPLACE-WITH-SEALED-SECRET"
  # External AI provider keys (sealed separately if needed)
  openai-api-key: "REPLACE-WITH-SEALED-SECRET"
  anthropic-api-key: "REPLACE-WITH-SEALED-SECRET"
  hf-token: "REPLACE-WITH-SEALED-SECRET"
---
# TLS certificate for ingress
# Generate with:
#   openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
#     -keyout freeai-tls.key -out freeai-tls.crt \
#     -subj "/CN=freeai.local"
#   kubectl create secret tls freeai-tls-secret \
#     --cert=freeai-tls.crt --key=freeai-tls.key \
#     -n freeai-stack
apiVersion: v1
kind: Secret
metadata:
  name: freeai-tls-secret
  namespace: freeai-stack
  labels:
    app: freeai
type: kubernetes.io/tls
stringData:
  tls.crt: "REPLACE-WITH-SEALED-OR-CREATED-SECRET"
  tls.key: "REPLACE-WITH-SEALED-OR-CREATED-SECRET"
