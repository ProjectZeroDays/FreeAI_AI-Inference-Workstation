site_name: FreeAI — Unified AI Workstation
site_description: Build, secure, and scale AI applications on your own hardware. Router, agents, workflows, security, and builder tools.
site_url: https://projectzerodays.github.io/FreeAI_AI-Inference-Workstation
repo_url: https://github.com/ProjectZeroDays/FreeAI_AI-Inference-Workstation
repo_name: ProjectZeroDays/FreeAI_AI-Inference-Workstation

nav:
  - Home: INDEX.md
  - Quick Start: FIRST-BOOT-GUIDE.md
  - Architecture: ARCHITECTURE.md
  - API Reference: API.md
  - Autonomous SDLC: AUTONOMOUS-AGENTS.md
  - Model Switching: MODEL-SWITCHING.md
  - Providers: PROVIDERS.md
  - MCP Registry: MCP.md
  - RAG & Vector DB: RAG.md
  - WebSocket: WEBSOCKET.md
  - Function Calling: FUNCTION_CALLING.md
  - Log Streaming: LOG_STREAMING.md
  - Deployment: DEPLOYMENT.md
  - Deployment Plans: DEPLOYMENT-PLANS.md
  - Cloud Fallback: CLOUD-FALLBACK.md
  - Security Overview: SECURITY_ADVANCED.md
  - Secrets Management: SECRETS.md
  - Codex Integration: CODEX-INTEGRATION.md
  - Performance:
      - Optimization Audit: OPTIMIZATION-AUDIT.md
      - Advanced Performance: PERFORMANCE_ADVANCED.md
  - UI & Dashboard:
      - Dashboard Guide: UI_ENHANCEMENTS.md
      - Model Registry UI: MODEL_REGISTRY_UI.md
      - VSCode Extension: VSCODE_EXTENSION.md
  - Stack Rating: STACK_RATING.md
  - Build Sheet: BUILD-SHEET.md
  - Enhancement Plan: ENHANCEMENT-PLAN.md
  - Gap Analysis: GAP-ANALYSIS-CODEX.md
  - Troubleshooting: TROUBLESHOOTING.md
  - Roadmap: ROADMAP.md
  - Changelog: CHANGELOG.md
  - Contributing: CONTRIBUTING.md

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    scheme: default
    primary: cyan
    accent: lime
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tabs.link
    - toc.follow
    - toc.integrate
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye

extra_css:
  - stylesheets/extra.css


markdown_extensions:
  - toc:
      permalink: true
      permalink_title: Anchor link
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables

plugins:
  - search

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ProjectZeroDays/FreeAI_AI-Inference-Workstation
    - icon: fontawesome/brands/docker
      link: https://hub.docker.com/r/projectzeroai/freeai
  analytics:
  version:
    provider: mike
