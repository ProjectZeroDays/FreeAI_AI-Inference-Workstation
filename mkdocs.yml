theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    scheme: slate
    primary: custom
    accent: lime
    media: screen
  custom_dir: partials
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tabs.link
    - toc.follow
    - toc.integrate
    - header.autohide
    - navigation.instant
    - navigation.instant.progress
    - navigation.paths
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye
    logo: custom/logo
    prev: material/chevron-left
    next: material/chevron-right
    top: material/arrow-up
  favicon: assets/logo.svg

extra_css:
  - stylesheets/extra.css
  - stylesheets/custom.css

markdown_extensions:
  - toc:
      permalink: true
      permalink_title: Anchor link
  - pymdownx.highlight:
      anchor_linenums: true
      use_pygments: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - attr_list
  - md_in_html
  - tables
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde

plugins:
  - search
  - social

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ProjectZeroDays/FreeAI_AI_Inference_Workstation
    - icon: fontawesome/brands/docker
      link: https://hub.docker.com/r/projectzeroai/freeai
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/freeai/
  analytics:
  version:
    provider: mike
  consent:
    title: Cookie consent
    description: >-
      We use cookies to recognize your repeated visits and preferences, as well
      as to measure the effectiveness of our documentation.
    actions:
      - accept
      - reject
