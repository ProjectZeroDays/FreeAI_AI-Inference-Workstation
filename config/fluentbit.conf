[SERVICE]
    Parsers_File parsers.conf
    Daemon off
    Log_Level info

[INPUT]
    Name tail
    Path /logs/*.log
    Tag freeai.logs.*
    Parser json
    DB /tmp/fluentbit.db
    Mem_Buf_Limit 5MB
    Skip_Long_Lines On
    Refresh_Interval 5

[FILTER]
    Name parser
    Match freeai.logs.*
    Key_Name log
    Parser json
    Reserve_Data On

[FILTER]
    Name modify
    Match freeai.logs.*
    Add service_name freeai-router
    Add host_name ${HOSTNAME}

[OUTPUT]
    Name stdout
    Match freeai.logs.*
    Format json
    JSON_Date_Key timestamp
    JSON_Date_Keep On
