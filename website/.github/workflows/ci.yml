name: Build & Lint Check

on:
  pull_request:
    branches: [main, master]
    paths:
      - 'website/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./website
        run: npm ci

      - name: Lint
        working-directory: ./website
        run: npm run lint

      - name: Build
        working-directory: ./website
        run: npm run build
