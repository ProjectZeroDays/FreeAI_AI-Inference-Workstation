[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
user=root

[program:llama]
command=/bin/bash llama/launch-llama.sh
directory=/stack
environment=LLAMA_MODEL_PATH="/models/Qwen3.6-12B-IQ-Ultra-Heretic-Uncensored-Thinking-Q6_K.gguf"
priority=10
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:router]
command=/stack/venv/bin/python router/router.py
directory=/stack
environment=LLAMA_BASE="http://127.0.0.1:9001",ROUTER_PORT="8010"
priority=20
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:agents]
command=/stack/venv/bin/python -m uvicorn agents.api:app --host 0.0.0.0 --port 8120
directory=/stack
environment=ROUTER_URL="http://127.0.0.1:8010/route"
priority=30
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:workflow]
command=/stack/venv/bin/python -m uvicorn workflow.api:app --host 0.0.0.0 --port 8040
directory=/stack
environment=AGENT_API="http://127.0.0.1:8020"
priority=40
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:autonomous]
command=/stack/venv/bin/python -m uvicorn autonomous.api:app --host 0.0.0.0 --port 8050
directory=/stack
environment=AGENT_API="http://127.0.0.1:8020"
priority=40
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:dashboard]
command=/stack/venv/bin/python dashboard/backend.py
directory=/stack
environment=DASHBOARD_PORT="8030"
priority=50
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
